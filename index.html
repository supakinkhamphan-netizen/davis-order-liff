<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- LINE's in-app webview caches this page hard: an upload can be live on the
     server while a phone still runs the previous build, which looks exactly
     like "the fix didn't work". Ask it not to. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Davis Order</title>
<!-- The API host is the one thing every screen waits on — get DNS/TLS out of
     the way while the HTML is still parsing. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded non-blocking: a webfont must never hold up first paint on a phone
     on hotel wifi. The system stack below renders immediately and Inter swaps
     in when it arrives. -->
<!-- IBM Plex Sans Thai, not Inter. Inter has no Thai glyphs at all, so this
     almost entirely Thai UI was downloading a full webfont it could not use,
     then falling back to a system Thai face — and `font-weight:800` on that
     face is synthesised bold, which smears the vowel and tone marks stacked
     above and below the consonants on a low-resolution screen. Plex Thai
     carries Thai, Latin and figures in one family, so a line mixing a room
     number and a Thai word finally sits on one baseline. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --bg:#F4F6F9; --card:#FFFFFF; --line:#E3E8EF;
    --ink:#0B1220;    /* 18.9:1 on card */
    --ink-2:#566172;  /* 6.3:1 — replaces #777 at 4.48:1, which failed AA */
    --ink-3:#1F2937;  /* 15.3:1 — the order items themselves, the thing being fetched */
    --ok:#15803D;
    --warn-bg:#FEF3C7; --warn-ink:#92400E;  /* 6.4:1 */
    --hot-bg:#FFEDD5;  --hot-ink:#7C2D12;   /* 8.9:1 */
    --free-bg:#EAF2FF; --free-ink:#1E40AF;  /* 8.1:1 */
    --danger:#B91C1C;
    --btn-h:56px; --btn-r:12px; --card-r:16px; --gap:12px; --pad:16px;
    --head-h:64px; --tabs-h:48px;
  }
  /* Night shift in a dark bar: a full-screen white page at 01:00 blinds the
     runner for a couple of seconds every time they open the app, and flashes
     in the guests' eyes. Status pairs keep their contrast when inverted. */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0B1220; --card:#161E2E; --line:#2A3446;
      --ink:#E8EDF4; --ink-2:#9AA7B8; --ink-3:#D5DDE8;
      --warn-bg:#3A2E0B; --warn-ink:#FCD34D;
      --hot-bg:#3A210B;  --hot-ink:#FDBA74;
      --free-bg:#12233F; --free-ink:#93C5FD;
      --ok:#4ADE80; --danger:#F87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'IBM Plex Sans Thai',-apple-system,'Helvetica Neue',sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; padding-bottom:70px; }
  header { background:var(--ink); color:var(--card); padding:0 16px; height:var(--head-h); display:flex; align-items:center; position:sticky; top:0; z-index:6; }
  header h1 { font-weight:800; font-size:1.2rem; margin:0; }
  header .who { font-size:12px; color:#cfd2d6; margin-top:3px; min-height:15px; }
  header .headRow { display:flex; align-items:center; gap:12px; }
  header #avatar { width:42px; height:42px; border-radius:50%; object-fit:cover; background:#333; display:none; }
  .nudgeBtn { margin-top:8px; width:100%; min-height:38px; border:1px solid var(--line); border-radius:10px; background:#fff; color:#000; font-size:13px; font-weight:600; }
  .sumRow { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .sumRow:last-child { border-bottom:none; }
  .sumTotal { display:flex; justify-content:space-between; padding:14px 0 0; font-weight:800; font-size:16px; }
  /* top must equal the header's real height or the tab bar slides up under it
     while scrolling — it was pinned at 56px against a ~70px header. Both now
     come from the same token. */
  .tabs { display:flex; height:var(--tabs-h); position:sticky; top:var(--head-h); background:var(--card); z-index:5; box-shadow:0 1px 0 var(--line); }
  .tabs button { flex:1; border:none; background:none; padding:12px; font-size:15px; font-weight:600; color:var(--ink-2); }
  .tabs button.active { color:var(--ink); border-bottom:3px solid var(--ink); font-weight:700; }
  #list { padding:12px; max-width:520px; margin:0 auto; }
  .empty { text-align:center; padding:60px 20px; color:var(--ink-2); }
  .card { background:var(--card); border-radius:14px; padding:16px 18px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .card.skeleton { color:transparent; }
  .card.skeleton * { background:#eceef1; border-radius:6px; color:transparent !important; animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .card { padding:var(--pad); border-radius:var(--card-r); }
  .card .id { font-size:11px; letter-spacing:.06em; color:var(--ink-2); font-weight:600; }
  .card .title { font-size:17px; font-weight:700; margin-top:2px; line-height:1.45; }
  .card .sub { font-size:14px; color:var(--ink-2); margin-top:2px; }
  /* The items ARE the job — what to go and fetch. They were the faintest text
     on the card at #777/13px, below the AA floor. */
  .card .items { font-size:15px; font-weight:500; color:var(--ink-3); margin-top:10px; white-space:pre-wrap; line-height:1.55; }
  .groupHead { font-size:14px; font-weight:700; color:var(--ink-2); margin:18px 4px 8px; display:flex; justify-content:space-between; }
  .clock { display:flex; align-items:center; gap:6px; font-size:15px; font-weight:600; padding:10px 12px; border-radius:10px; margin:-4px -4px 12px; line-height:1.4; }
  .clock.calm { background:transparent; color:var(--ink-2); padding-left:0; }
  .clock.warn { background:var(--warn-bg); color:var(--warn-ink); }
  .clock.hot  { background:var(--hot-bg);  color:var(--hot-ink); }
  .clock.free { background:var(--free-bg); color:var(--free-ink); }
  .rowMini { display:flex; align-items:center; gap:12px; }
  .rowMini .body { flex:1; min-width:0; }
  .rowMini .body .items { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .miniBtn { width:112px; min-height:72px; border:none; border-radius:var(--btn-r); background:var(--ok); color:#fff; font-size:15px; font-weight:700; }
  .moreBtn { position:absolute; right:10px; bottom:10px; width:36px; height:36px; border:none; background:none; color:var(--ink-2); font-size:20px; }
  .moreMenu { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; display:none; }
  .moreMenu.open { display:block; }
  .moreMenu button, .moreMenu a { display:block; width:100%; text-align:left; padding:12px 4px; border:none; background:none; font-size:15px; color:var(--ink); font-family:inherit; text-decoration:none; }
  /* Unconfirmed = a SHAPE (left edge), never colour alone. */
  .card.pending { border-left:3px solid var(--ink-2); }
  .card.failed  { border-left:3px solid var(--danger); }
  #offlineBar { position:sticky; top:calc(var(--head-h) + var(--tabs-h)); z-index:4; display:none;
    background:var(--warn-bg); color:var(--warn-ink); font-size:14px; font-weight:600;
    padding:12px 16px; align-items:center; justify-content:space-between; gap:10px; }
  #offlineBar button { border:1px solid currentColor; background:none; color:inherit; border-radius:8px; padding:7px 12px; font-size:14px; font-weight:700; font-family:inherit; }
  #learnBar { max-width:520px; margin:12px auto 0; background:var(--free-bg); color:var(--free-ink); font-size:14px; line-height:1.5; padding:12px 14px; border-radius:10px; display:none; justify-content:space-between; gap:10px; }
  #learnBar button { border:none; background:none; color:inherit; font-weight:700; font-size:14px; font-family:inherit; }
  .progress { margin-top:14px; }
  .progress .track { height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
  .progress .fill { height:100%; background:var(--ok); border-radius:3px; transition:width .3s; }
  .progress .label { display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:var(--ink-2); }
  .progress .label b { color:#000; font-weight:700; }
  /* 56px, not 46px: one wet hand, gloves, in a hurry, and pressing the wrong
     one costs real money. */
  .actionBtn { margin-top:16px; width:100%; min-height:var(--btn-h); border:none; border-radius:var(--btn-r); font-weight:700; font-size:17px; font-family:inherit; background:var(--ink); color:var(--card); }
  .actionBtn.green { background:var(--ok); color:#fff; }
  .actionBtn:active { transform:scale(.98); }
  /* Never fade a working button: in a dark room a faded button reads as "it
     didn't register" and the runner presses again. Go darker instead. */
  .actionBtn.busy { background:#374151; color:#fff; }
  .actionBtn.ok { background:var(--ok); color:#fff; }
  .actionBtn.fail { background:var(--danger); color:#fff; }
  .actionBtn[disabled]:not(.busy):not(.ok):not(.fail) { background:var(--line); color:var(--ink-2); }
  .miniform { margin-top:12px; border-top:1px solid var(--line); padding-top:12px; display:none; }
  .miniform.open { display:block; }
  /* No uppercase (does nothing in Thai) and no letter-spacing (it pushes the
     vowels and tone marks away from the consonant they belong to). */
  .miniform label { display:block; font-size:15px; color:var(--ink-2); font-weight:600; margin-top:12px; }
  .miniform input, .miniform select { width:100%; min-height:44px; padding:8px 10px; margin-top:4px; border:1px solid var(--line); border-radius:8px; font-size:16px; }
  .miniform .err { color:var(--danger); font-size:15px; font-weight:600; margin-top:10px; min-height:18px; line-height:1.5; }
  #boot { text-align:center; padding:80px 20px; color:var(--ink-2); }
  #lastUpdated { text-align:center; font-size:12px; color:var(--ink-2); padding:10px; }
  #toast { position:fixed; left:16px; right:16px; top:calc(var(--head-h) + var(--tabs-h) + 8px); background:#000; color:#fff; padding:12px 16px; border-radius:10px; font-size:14px; text-align:center; transform:translateY(120%); transition:transform .25s; z-index:20; }
  /* Hidden must mean HIDDEN. translateY(-140%) is 140% of the toast's own
     height — about 50px — which parked it right on top of the tab bar instead
     of off-screen. Opacity + visibility cannot be off by a few pixels. */
  #toast { opacity:0; visibility:hidden; transform:translateY(-12px); transition:opacity .2s, transform .2s, visibility .2s; }
  #toast.show { opacity:1; visibility:visible; transform:translateY(0); }
  #toast.err { background:var(--danger); }
  #scopeBanner { max-width:520px; margin:12px auto 0; padding:10px 14px; background:#FEF3C7; color:#92400E; border-radius:10px; font-size:13px; font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  #scopeBanner a { color:#92400E; font-weight:800; white-space:nowrap; }
  /* "ทั้งหมด"/"สรุปเดือนนี้" mix every shop together — this is the one control
     that lets a runner or a manager pull one shop back out of that mix. Hidden
     entirely when only one shop is in play, so it never costs a single-shop
     shift any screen space. */
  #shopFilterBar { display:none; max-width:520px; margin:10px auto 0; }
  .shopChipRow { display:flex; gap:8px; overflow-x:auto; padding:0 12px 2px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .shopChipRow::-webkit-scrollbar { display:none; }
  .shopChip { flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink-2); font-family:inherit; font-size:14px; font-weight:600; padding:8px 14px; border-radius:999px; white-space:nowrap; }
  .shopChip.active { background:var(--ink); color:var(--card); border-color:var(--ink); }
  .mgrPeriodRow { display:flex; gap:8px; margin-top:10px; }
  .mgrMonthInput { margin-top:10px; width:100%; min-height:44px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:16px; font-family:inherit; background:var(--card); color:var(--ink); }
</style>
</head>
<body>

<div id="boot">
  <div style="font-size:32px">🛎️</div>
  <div style="margin-top:8px">กำลังเชื่อมต่อ LINE...</div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="headRow">
      <img id="avatar" alt="" />
      <div>
        <h1>🛎️ Davis Order <span id="buildTag" style="font-size:11px;font-weight:400;opacity:.6"></span></h1>
        <div class="who" id="whoLine"></div>
      </div>
    </div>
  </header>
  <div class="tabs">
    <button id="tabMine" class="active">ต้องทำ</button>
    <button id="tabAll">ทั้งหมด</button>
    <button id="tabSummary">สรุปเดือนนี้</button>
    <!-- Hidden until whoAmI resolves a manager/venue_manager role — 'staff'
         never sees this tab exist, same boundary the backend enforces. -->
    <button id="tabManager" style="display:none">ผู้บริหาร</button>
  </div>
  <div id="offlineBar"><span id="offlineText"></span><button onclick="forceRefresh()">ลองใหม่</button></div>
  <div id="scopeBanner" style="display:none"></div>
  <div id="learnBar"><span id="learnText"></span><button onclick="hideLearnBar()">ซ่อน</button></div>
  <div id="shopFilterBar"></div>
  <div id="list"></div>
  <p id="lastUpdated"></p>
</div>

<div id="toast"></div>

<!-- Config + helpers, above the SDK tag so they exist before anything uses
     them. This used to also fire the board request here, ahead of the SDK
     download, which is only possible for an unauthenticated call — and that
     is exactly what made the board (guest room numbers included) readable by
     anyone with the URL. The data fetch now happens after liff.init(). -->
<script>
  // ---- fill these two in before publishing ----
  // Bump on every upload. Shown in the header, so "is the phone running the
  // new build?" is answered by looking at the screen instead of guessing.
  var BUILD = 'v16';
  var LIFF_ID = '2011319750-tMh303eW';
  var API_URL = 'https://script.google.com/macros/s/AKfycbw67bRdK_Ff-FljQNOAV-HZIVHnY-qfarGYRPXDZJckioQrxYf9LlQ1yAhO2IIGjq7-Xw/exec';
  // ----------------------------------------------

  /**
   * Calls the whitelist dispatcher in order-liff-api.js. text/plain avoids a
   * CORS preflight (Apps Script has no doOptions) — see that file's header
   * comment for the full reasoning.
   */
  function callApi(fn, payload) {
    // Hotel wifi drops mid-upload and fetch() then never settles: the promise
    // hangs, the button stays disabled, and the runner is stuck with no way
    // forward. Uploads get longer than reads because they carry photos.
    var isUpload = /^submitOrder/.test(fn);
    var controller = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (controller) controller.abort(); }, isUpload ? 90000 : 20000);
    var opts = {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ liffCall: true, fn: fn, payload: payload || {} }),
    };
    if (controller) opts.signal = controller.signal;
    return fetch(API_URL, opts)
      .then(function (r) { return r.json(); })
      .finally(function () { clearTimeout(timer); });
  }

  /**
   * Opening ".../<liffId>?group=REQ_x" scopes the page to one request — the
   * "ดูทั้งคำขอ" button on a multi-shop order card. LIFF sometimes has to
   * redirect, and then it hands the original query over inside `liff.state`
   * instead, so read both forms. Done here (not after liff.init) because the
   * board request below is fired before the SDK has even loaded.
   */
  function readGroupParam() {
    var q = new URLSearchParams(location.search);
    var direct = q.get('group');
    if (direct) return direct;
    var state = q.get('liff.state');
    if (state) {
      var m = /[?&]group=([^&]+)/.exec(decodeURIComponent(state));
      if (m) return decodeURIComponent(m[1]);
    }
    return '';
  }
  var REQUEST_GROUP = readGroupParam();

  // The pre-SDK head start is deliberately gone. The board carries guest room
  // numbers, so it may no longer be fetched before liff.init() supplies an ID
  // token — a request with no identity is precisely what left it readable by
  // anyone holding this URL. First paint costs about a second more; the trade
  // is not close.
  var firstBoard = null;
</script>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>

  var STAGE_LABELS = ['รอร้านรับ', 'เตรียมอาหาร', 'กำลังจัดส่ง', 'ส่งมอบแล้ว'];
  var idToken = '';
  var accessToken = ''; // liff.getIDToken() is empty without the `openid` scope; the access token needs only `profile`
  // 'pending' -> still asking LINE who this is | 'none' -> not in LINE, or no
  // credential | 'ok' -> identified. render() has to know the difference:
  // without it, switching tabs after a failed sign-in repainted skeleton cards
  // and told the user "loading" forever about something already known to be
  // impossible.
  var authState = 'pending';
  function creds() { return { idToken: idToken, accessToken: accessToken }; }
  var me = null;
  var currentTab = 'mine';
  // '' = every shop. Persists across tabs/polls on purpose: someone who picks
  // "ร้าน A" on "ทั้งหมด" almost always wants that same shop on "สรุปเดือนนี้" too.
  var shopFilter = '';
  var allRows = null; // null = never loaded yet (shows skeleton, not "empty")
  var summary = null; // month-to-date totals, loaded lazily when the tab is opened
  // ผู้บริหาร tab state — separate from `summary` above (that one's always the
  // current month; this one's an arbitrary period/month a manager picked).
  var managerDays = 30;
  var managerMonthKey = '';
  var managerLeaderboard = null;
  var managerRecon = null;
  var openForms = {}; // orderId -> true while its inline form is open
  var refreshing = false; // guards against overlapping poll ticks piling up
  var toastTimer = null;
  var lastPayload = ''; // last board JSON — skip the repaint when nothing moved
  var pollTimer = null;
  // Every board fetch remembers the generation it was issued in; a write bumps
  // the generation. A poll that left BEFORE the write carries pre-write data,
  // so it is discarded on arrival instead of painting the card back to its old
  // stage. Without this the status visibly jumped backwards, the runner
  // pressed again, and got "มีคนรับออเดอร์นี้แล้ว: <their own name>" — the
  // real remainder of the "must close and reopen" complaint.
  var boardGeneration = 0;
  var serverNowMs = 0;      // server clock at the moment of the last successful fetch
  var serverNowLocal = 0;   // performance.now() at that same moment
  var failedFetches = 0;    // navigator.onLine lies on hotel wifi (associated, no internet)
  var pendingReorder = false; // a row changed group while the board was still on screen
  var clockTimer = null;
  var openMenus = {};

  // ---- SLA clocks -------------------------------------------------------
  // These thresholds are the fine schedule in order-sla.js (SLA_BANDS_CASHIER_,
  // SLA_BANDS_KITCHEN_, SLA_CASHIER_RESCUE_MINUTES_). The screen has been
  // showing none of it: the same button costs 0฿ on one card and 200฿ on the
  // next, and nothing on screen said which. That is not a polish problem, it
  // is a fairness problem.
  var CASHIER_100 = 300, CASHIER_200 = 600, CASHIER_RESCUE = 900; // seconds
  var KITCHEN_LIMIT = 780; // 13 นาที — just under the 15-minute kitchen band

  /** Seconds since a "yyyy-MM-dd HH:mm:ss" stamp, measured against the SERVER
   *  clock we were handed, not the phone's — an old handset is routinely
   *  minutes out, and this number decides who gets fined. Keeps running while
   *  offline: the fine does not pause because the wifi did. */
  function secondsSince(stamp) {
    if (!stamp || !serverNowMs) return 0;
    var t = Date.parse(stamp.replace(' ', 'T'));
    if (isNaN(t)) return 0;
    var nowMs = serverNowMs + (performance.now() - serverNowLocal);
    return Math.max(0, Math.floor((nowMs - t) / 1000));
  }

  function mmss(sec) {
    var m = Math.floor(sec / 60), ss = sec % 60;
    return m + ':' + (ss < 10 ? '0' + ss : ss);
  }
  function humanMins(sec) { return Math.floor(sec / 60) + ' นาที'; }
  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function thisMonthKey_() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }

  /**
   * What the cashier clock should say right now. Always frames it as time
   * REMAINING while any remains — a countdown is help, a count-up is an
   * accusation. Past the rescue line it says so plainly, because that rule
   * exists precisely so nobody walks past an order everyone else is avoiding,
   * and a rule nobody is told about changes nobody's behaviour.
   */
  function cashierClock(r) {
    var sec = secondsSince(r.orderedAt);
    if (sec >= CASHIER_RESCUE) {
      return { tier: 'free', group: 2, sec: sec,
        text: '🅿 ค้าง ' + humanMins(sec) + ' · ใบนี้ไม่หักคุณ' };
    }
    if (sec >= CASHIER_200) {
      return { tier: 'hot', group: 1, sec: sec,
        text: '⏱ ' + mmss(sec) + '  เกณฑ์ 200฿ · อีก ' + mmss(CASHIER_RESCUE - sec) + ' จะเป็นออเดอร์ค้าง (ไม่หักคุณ)' };
    }
    if (sec >= CASHIER_100) {
      return { tier: 'hot', group: 1, sec: sec,
        text: '⏱ ' + mmss(sec) + '  เลยเกณฑ์ 100฿ · เหลือ ' + mmss(CASHIER_200 - sec) + ' ก่อนขึ้น 200฿' };
    }
    if (sec >= 180) {
      var left = CASHIER_100 - sec;
      return { tier: 'warn', group: 1, sec: sec,
        // Seconds only inside the last minute; eight cards all ticking their
        // seconds at once is unreadable and just makes the screen feel frantic.
        text: '⏱ ' + mmss(sec) + '  เหลือ ' + (left < 60 ? left + ' วิ' : mmss(left)) + ' ก่อนถึงเกณฑ์ 100฿' };
    }
    return { tier: 'calm', group: 4, sec: sec, text: '⏱ ' + mmss(sec) + ' · ยังมีเวลา' };
  }

  /** The kitchen window is charged to the kitchen lead, never to the runner who
   *  reports it (order-sla.js). Saying so out loud is the whole point: fear of
   *  being charged is why people hesitate on this button too. */
  function kitchenClock(r) {
    var sec = secondsSince(r.keyedAt);
    if (sec >= KITCHEN_LIMIT) {
      return { tier: 'free', sec: sec, text: '🍳 ครัวทำมา ' + humanMins(sec) + ' · เกินเกณฑ์ครัวแล้ว — กดได้เลย ไม่หักคุณ' };
    }
    return { tier: 'calm', sec: sec, text: '🍳 ครัวทำมา ' + humanMins(sec) };
  }

  function clockFor(r) {
    return r.stage === 0 ? cashierClock(r) : kitchenClock(r);
  }

  /** Which section a row belongs in. Ordering is by what it costs to leave the
   *  order alone, not by when it arrived. */
  function groupOf(r) {
    if (r.stage === 0) return cashierClock(r).group;
    return 3; // claimed and in progress
  }

  // callApi() and firstBoard are declared in the block above the SDK tag.

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }

  // ---- Shop filter --------------------------------------------------------
  /** Shop names in the order they first appear, de-duplicated. */
  function distinctShops(rows) {
    var seen = {}, out = [];
    (rows || []).forEach(function (r) {
      if (r.seller && !seen[r.seller]) { seen[r.seller] = true; out.push(r.seller); }
    });
    out.sort(function (a, b) { return a.localeCompare(b, 'th'); });
    return out;
  }

  /**
   * Redrawn on every render() / renderSummary() call with whatever shops are
   * actually present in that tab's data right now — a shop with nothing open
   * simply doesn't get a chip. With 0 or 1 shop there is nothing to filter, so
   * the whole bar disappears rather than sit there doing nothing.
   */
  function renderShopFilterBar(shops) {
    var bar = document.getElementById('shopFilterBar');
    if (!shops || shops.length < 2) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
    bar.innerHTML = '<div class="shopChipRow">' +
      '<button class="shopChip' + (shopFilter === '' ? ' active' : '') + '" data-shop="">ทุกร้าน</button>' +
      shops.map(function (s) {
        return '<button class="shopChip' + (shopFilter === s ? ' active' : '') + '" data-shop="' + escAttr(s) + '">' + esc(s) + '</button>';
      }).join('') +
      '</div>';
    bar.style.display = 'block';
  }
  function hideShopFilterBar() {
    var bar = document.getElementById('shopFilterBar');
    bar.style.display = 'none';
    bar.innerHTML = '';
  }
  document.getElementById('shopFilterBar').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-shop]');
    if (!btn) return;
    shopFilter = btn.getAttribute('data-shop') || '';
    if (currentTab === 'summary') renderSummary(); else render();
  });

  function toast(msg, isErr) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = isErr ? 'err show' : 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }

  // A single slim bar + "N/4 · label" line reads faster on a phone than four
  // dot-and-caption columns, and leaves more room for the action button below.
  function progressHtml(stage) {
    var pct = Math.round((stage / 3) * 100);
    return '<div class="progress">' +
      '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>' +
      '<div class="label"><span>ขั้น ' + (stage + 1) + '/4</span><b>' + STAGE_LABELS[stage] + '</b></div>' +
      '</div>';
  }

  // ---- Photo picker: shrink to a reasonable size before base64-encoding, same reasoning as photo-input.html on the Apps Script side ----
  function shrinkPhoto(file, done) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        done(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function () { done(reader.result); };
      img.src = reader.result;
    };
    reader.onerror = function () { done(null); };
    reader.readAsDataURL(file);
  }

  function actionSectionHtml(row, mini) {
    if (row.stage === 3) return '';
    if (row.stage === 0) {
      return '<button class="actionBtn" id="btn-' + row.orderId + '" onclick="doClaim(\'' + row.orderId + '\')">รับออเดอร์นี้</button>';
    }
    if (mini) {
      // Claimed work is a compact row: the runner already knows what it is.
      var label = (row.stage === 1 && row.is24) ? 'รับอาหาร'
        : (row.stage === 1) ? 'ส่งแล้ว'
        : 'ส่งมอบ';
      var fn = (row.stage === 2 && row.is24) ? 'doComplete' : 'toggleForm';
      return '<button class="miniBtn" id="btn-' + row.orderId + '" onclick="' + fn + '(\'' + row.orderId + '\')">' + label + '</button>';
    }
    if (row.stage === 1 && row.is24) {
      return miniFormHtml(row.orderId, '🍳 รับอาหาร (ถ่ายรูปบิล)', 'submitFood');
    }
    if (row.stage === 1 && !row.is24) {
      return miniFormHtml(row.orderId, '✅ ส่งแล้ว (แนบบิล)', 'submitDeliverForm');
    }
    if (row.stage === 2 && row.is24) {
      return '<button class="actionBtn green" id="btn-' + row.orderId + '" onclick="doComplete(\'' + row.orderId + '\')">✅ ส่งมอบให้ลูกค้า</button>';
    }
    return '';
  }

  function miniFormHtml(orderId, label, submitFnName) {
    return '<button class="actionBtn green" id="btn-' + orderId + '" onclick="toggleForm(\'' + orderId + '\')">' + label + '</button>' +
      formBodyHtml(orderId, submitFnName);
  }

  /**
   * BUG FIXED: the compact "in progress" row rendered only the button, never
   * this form — so pressing รับอาหาร marked the form open, re-rendered the same
   * button, and nothing appeared. Worse, openForms was now non-empty, which
   * stops the poll (refresh() bails while a form is open), so the whole board
   * froze as well. The form markup now lives in one place and both layouts use it.
   */
  function formBodyHtml(orderId, submitFnName) {
    var open = !!openForms[orderId];
    return '<div class="miniform' + (open ? ' open' : '') + '" id="form-' + orderId + '">' +
      '<label>ยอดเงินจริง</label><input type="number" inputmode="decimal" id="amt-' + orderId + '" placeholder="เช่น 350" />' +
      '<label>Payment</label><select id="pay-' + orderId + '"><option value="Room Charge">Room Charge</option><option value="Cash">Cash</option><option value="Card">Card</option></select>' +
      // No `capture` attribute: it forces the camera on many phones, so a bill that
      // was already photographed (or already handed back) could not be attached at
      // all. `multiple` matches what the Apps Script form has always accepted — a
      // long bill runs to two pages.
      '<label>รูปบิล (แนบได้หลายรูป)</label><input type="file" accept="image/*" multiple id="photo-' + orderId + '" />' +
      '<button class="actionBtn" style="margin-top:10px" id="submit-' + orderId + '" onclick="' + submitFnName + '(\'' + orderId + '\')">บันทึก</button>' +
      '<div class="err" id="err-' + orderId + '"></div>' +
      '</div>';
  }

  /** Opening one card's form closes any other open one — one decision on screen at a time, not a wall of forms. */
  function toggleForm(orderId) {
    var wasOpen = !!openForms[orderId];
    openForms = {};
    openForms[orderId] = !wasOpen;
    render();
  }

  function skeletonCards() {
    var one = '<div class="card skeleton"><div class="id">ORD_20260101_01</div>' +
      '<div class="title">กำลังโหลด...</div><div class="items">กำลังโหลดรายการ...</div></div>';
    return one + one + one;
  }

  function noAuthHtml() {
    return '<div class="empty"><div style="font-size:40px">🔒</div>' +
      '<div style="font-size:17px;font-weight:700;margin-top:16px;color:var(--ink)">ต้องเปิดจากไลน์เท่านั้น</div>' +
      '<div style="font-size:15px;margin-top:10px;line-height:1.7">หน้านี้แสดงเลขห้องและรายการของแขก<br>' +
      'จึงเปิดจากเบราว์เซอร์ธรรมดาไม่ได้<br><br>' +
      'ไปที่กลุ่มออเดอร์ในไลน์ แล้วกดปุ่ม<br><b>"📦 ดูสถานะออเดอร์"</b></div></div>';
  }

  function renderSummary() {
    var list = document.getElementById('list');
    if (authState === 'none') { hideShopFilterBar(); list.innerHTML = noAuthHtml(); return; }
    if (!summary) { hideShopFilterBar(); list.innerHTML = skeletonCards(); return; }
    renderShopFilterBar(distinctShops(summary.rows));
    var rows = shopFilter ? summary.rows.filter(function (r) { return r.seller === shopFilter; }) : summary.rows;
    if (rows.length === 0) {
      list.innerHTML = shopFilter
        ? '<div class="empty">ยังไม่มีออเดอร์ที่ส่งมอบแล้วของ "' + esc(shopFilter) + '" ในเดือนนี้</div>'
        : '<div class="empty">ยังไม่มีออเดอร์ที่ส่งมอบแล้วในเดือนนี้</div>';
      return;
    }
    // The server's grandTotal is authoritative for the unfiltered view; once a
    // shop is picked the total has to be recomputed from just its rows.
    var total = shopFilter ? rows.reduce(function (sum, r) { return sum + Number(r.amount || 0); }, 0) : summary.grandTotal;
    list.innerHTML = '<div class="card"><div class="id">สรุปเดือน ' + esc(summary.monthKey) + (shopFilter ? ' · ' + esc(shopFilter) : '') + '</div>' +
      rows.map(function (r) {
        return '<div class="sumRow"><span>' + esc(r.seller) + ' → ' + esc(r.buyer) + ' <span style="color:var(--ink-2)">(' + r.count + ' ออเดอร์)</span></span>' +
          '<b>' + Number(r.amount).toLocaleString('en-US') + '</b></div>';
      }).join('') +
      '<div class="sumTotal"><span>' + (shopFilter ? 'รวมเฉพาะร้านนี้' : 'รวมทั้งหมด') + '</span><span>' + Number(total).toLocaleString('en-US') + ' บาท</span></div>' +
      '</div>';
  }

  /**
   * ผู้บริหาร tab: two independent cards (SLA leaderboard, monthly
   * reconciliation) that each load and fail on their own — a slow/broken
   * reconciliation query must not blank out a working leaderboard, and vice
   * versa. Neither ever runs for a plain 'staff' caller: the tab that opens
   * this view is itself hidden until whoAmIViaLiff says otherwise, and the
   * backend re-checks role independently (requireManagerActor_).
   */
  function renderManager() {
    hideShopFilterBar();
    var list = document.getElementById('list');
    if (authState === 'none') { list.innerHTML = noAuthHtml(); return; }

    var html = '<div class="card"><div class="id">🏆 อันดับค่าปรับ SLA</div>' +
      '<div class="mgrPeriodRow">' +
      [7, 30, 90].map(function (d) {
        return '<button class="shopChip' + (managerDays === d ? ' active' : '') + '" onclick="setManagerDays(' + d + ')">' + d + ' วัน</button>';
      }).join('') +
      '</div>';
    if (!managerLeaderboard) {
      html += '<div style="font-size:13px;color:var(--ink-2);margin-top:10px">กำลังโหลด...</div>';
    } else if (managerLeaderboard.error) {
      html += '<div class="empty" style="padding:16px 0">' + esc(managerLeaderboard.error) + '</div>';
    } else if (!managerLeaderboard.rows.length) {
      html += '<div class="empty" style="padding:16px 0">ไม่มีรายการโดนปรับใน ' + managerDays + ' วันที่ผ่านมา 🎉</div>';
    } else {
      if (managerLeaderboard.isScoped) html += '<div style="font-size:12px;color:var(--ink-2);margin-top:10px">แสดงเฉพาะร้านของคุณ</div>';
      html += managerLeaderboard.rows.map(function (r, i) {
        return '<div class="sumRow"><span>' + (i + 1) + '. ' + esc(r.name || '(ไม่ทราบชื่อ)') +
          ' <span style="color:var(--ink-2)">(' + r.count + ' ครั้ง)</span></span><b>' + Number(r.amount).toLocaleString('en-US') + '</b></div>';
      }).join('');
    }
    html += '</div>';

    html += '<div class="card"><div class="id">📅 สรุปรายเดือน</div>' +
      '<input type="month" class="mgrMonthInput" value="' + esc(managerMonthKey) + '" onchange="setManagerMonth(this.value)" />';
    if (!managerRecon) {
      html += '<div style="font-size:13px;color:var(--ink-2);margin-top:10px">กำลังโหลด...</div>';
    } else if (managerRecon.error) {
      html += '<div class="empty" style="padding:16px 0">' + esc(managerRecon.error) + '</div>';
    } else if (!managerRecon.rows.length) {
      html += '<div class="empty" style="padding:16px 0">ไม่มีออเดอร์ที่ส่งมอบแล้วในเดือนนี้</div>';
    } else {
      if (managerRecon.isScoped) html += '<div style="font-size:12px;color:var(--ink-2);margin-top:10px">แสดงเฉพาะร้านของคุณ</div>';
      html += managerRecon.rows.map(function (r) {
        return '<div class="sumRow"><span>' + esc(r.seller) + ' → ' + esc(r.buyer) +
          ' <span style="color:var(--ink-2)">(' + r.count + ' ออเดอร์)</span></span><b>' + Number(r.amount).toLocaleString('en-US') + '</b></div>';
      }).join('') +
        '<div class="sumTotal"><span>รวมทั้งหมด</span><span>' + Number(managerRecon.grandTotal).toLocaleString('en-US') + ' บาท</span></div>';
    }
    html += '</div>';

    list.innerHTML = html;
  }

  function loadManagerLeaderboard() {
    var payload = creds();
    payload.days = managerDays;
    callApi('slaLeaderboardViaLiff', payload).then(function (r) {
      managerLeaderboard = (r && r.error) ? r : (r || { error: 'โหลดไม่สำเร็จ' });
    }).catch(function () {
      managerLeaderboard = { error: 'โหลดไม่สำเร็จ ลองใหม่อีกครั้ง' };
    }).then(function () {
      if (currentTab === 'manager') renderManager();
    });
  }
  function loadManagerRecon() {
    var payload = creds();
    payload.monthKey = managerMonthKey;
    callApi('monthlyReconciliationViaLiff', payload).then(function (r) {
      managerRecon = (r && r.error) ? r : (r || { error: 'โหลดไม่สำเร็จ' });
    }).catch(function () {
      managerRecon = { error: 'โหลดไม่สำเร็จ ลองใหม่อีกครั้ง' };
    }).then(function () {
      if (currentTab === 'manager') renderManager();
    });
  }
  function setManagerDays(d) {
    managerDays = d;
    managerLeaderboard = null;
    render();
    loadManagerLeaderboard();
  }
  function setManagerMonth(monthKey) {
    if (!monthKey) return;
    managerMonthKey = monthKey;
    managerRecon = null;
    render();
    loadManagerRecon();
  }

  var GROUP_META = [
    null,
    { key: 1, title: '⚡ กดใบนี้ก่อน' },
    { key: 2, title: '🅿 ค้างนาน — กดได้เลย ไม่หักคุณ' },
    { key: 3, title: '🔵 กำลังทำอยู่' },
    { key: 4, title: '⚪ ยังไม่ถึงเกณฑ์', collapsed: true },
  ];
  var group4Open = false;
  function cardHtml(r) {
    var title = r.isSell ? (esc(r.buyer) + ' สั่งจาก ' + esc(r.seller)) : esc(r.subtitle);
    var sub = r.isSell ? 'สั่งซื้อข้ามร้าน' : esc(r.seller);
    if (r.orderedByName) sub += ' · สั่งโดย ' + esc(r.orderedByName);
    var c = clockFor(r);
    var menuOpen = !!openMenus[r.orderId];
    return '<div class="card" style="position:relative" id="card-' + r.orderId + '">' +
      '<div class="clock ' + c.tier + '" id="clk-' + r.orderId + '">' + esc(c.text) + '</div>' +
      '<div class="title">' + title + '</div>' +
      '<div class="sub">' + sub + '</div>' +
      '<div class="items">' + esc(r.items) + '</div>' +
      actionSectionHtml(r) +
      '<button class="moreBtn" onclick="toggleMenu(\'' + r.orderId + '\')" aria-label="ตัวเลือกเพิ่มเติม">⋯</button>' +
      '<div class="moreMenu' + (menuOpen ? ' open' : '') + '" id="menu-' + r.orderId + '">' +
        '<div style="font-size:12px;color:var(--ink-2);padding:0 4px 4px">' + esc(r.orderId) + '</div>' +
        // 🔔 fires a real, billed LINE push and wakes a manager at 01:00. It used
        // to sit full-width 8px under the main button — one slip with a wet
        // thumb. Behind ⋯ it always takes two deliberate taps.
        (r.stage < 3 ? '<button id="nudge-' + r.orderId + '" onclick="doNudge(\'' + r.orderId + '\')">🔔 เตือนผู้จัดการร้าน</button>' : '') +
        (r.billUrls && r.billUrls.length
          ? '<a href="' + esc(r.billUrls[0]) + '" target="_blank" rel="noopener">🧾 ดูบิลที่ส่งไป (' + r.billUrls.length + ' รูป)</a>'
          : '<div style="padding:12px 4px;color:var(--ink-2);font-size:15px">🧾 ยังไม่มีรูปบิล</div>') +
        '<button onclick="showRules()">📋 กติกาค่าปรับ</button>' +
      '</div>' +
      '</div>';
  }

  function miniRowHtml(r) {
    var c = clockFor(r);
    return '<div class="card" style="position:relative" id="card-' + r.orderId + '">' +
      '<div class="clock ' + c.tier + '" id="clk-' + r.orderId + '">' + esc(c.text) + '</div>' +
      '<div class="rowMini"><div class="body">' +
      '<div class="title" style="font-size:16px">' + esc(r.subtitle) + '</div>' +
      '<div class="sub">' + esc(r.seller) + '</div>' +
      '<div class="items" style="margin-top:4px">' + esc(r.items.replace(/\n/g, ', ')) + '</div>' +
      '</div>' + actionSectionHtml(r, true) + '</div>' +
      // stage 1 needs a bill + amount before it can advance; stage 2 is a bare press.
      (r.stage === 1 ? formBodyHtml(r.orderId, r.is24 ? 'submitFood' : 'submitDeliverForm') : '') +
      '</div>';
  }

  function render() {
    var list = document.getElementById('list');
    if (authState === 'none') { hideShopFilterBar(); list.innerHTML = noAuthHtml(); return; }
    if (currentTab === 'summary') { renderSummary(); return; }
    if (currentTab === 'manager') { renderManager(); return; }
    if (allRows === null) { hideShopFilterBar(); list.innerHTML = skeletonCards(); return; }
    var tabRows = allRows.filter(function (r) {
      if (currentTab === 'all') return true;
      // While whoAmI is still in flight `me` is null. The old test dropped
      // every claimed row in that window, so for the first few seconds of every
      // shift a runner holding two bags saw an empty "ต้องทำ" — which teaches
      // people not to trust the screen. Unknown identity now shows more, not less.
      if (r.stage >= 3) return false;
      if (!r.assignedUserId) return true;
      return !me || r.assignedUserId === me.userId;
    });

    // Chip list reflects THIS tab's shops (pre-filter), so switching back to
    // "ทุกร้าน" is always one tap away even after picking one.
    renderShopFilterBar(distinctShops(tabRows));
    var rows = shopFilter ? tabRows.filter(function (r) { return r.seller === shopFilter; }) : tabRows;

    if (rows.length === 0) {
      list.innerHTML = shopFilter
        ? '<div class="empty"><div style="font-size:40px">🌙</div>' +
          '<div style="font-size:17px;font-weight:700;margin-top:16px;color:var(--ink)">ไม่มีออเดอร์ค้างของ "' + esc(shopFilter) + '" ตอนนี้</div></div>'
        : '<div class="empty"><div style="font-size:40px">🌙</div>' +
          '<div style="font-size:17px;font-weight:700;margin-top:16px;color:var(--ink)">ไม่มีออเดอร์ค้างตอนนี้</div>' +
          // The real ambiguity is "no work" versus "the app is broken" — say which.
          '<div style="font-size:15px;margin-top:10px;line-height:1.6">หน้าจอจะขึ้นเองเมื่อมีออเดอร์ใหม่<br>ไม่ต้องคอยกดรีเฟรช</div></div>';
      return;
    }

    var buckets = { 1: [], 2: [], 3: [], 4: [] };
    rows.forEach(function (r) { buckets[groupOf(r)].push(r); });
    Object.keys(buckets).forEach(function (k) {
      buckets[k].sort(function (a, b) { return clockFor(b).sec - clockFor(a).sec; }); // longest waiting first
    });

    var html = '';
    [1, 2, 3, 4].forEach(function (g) {
      var items = buckets[g];
      if (!items.length) return;
      var meta = GROUP_META[g];
      var collapsed = g === 4 && !group4Open;
      html += '<div class="groupHead"><span>' + meta.title + ' (' + items.length + ')</span>' +
        (g === 4 ? '<button onclick="group4Open=!group4Open;render()" style="border:none;background:none;color:inherit;font-size:15px;font-family:inherit">' + (collapsed ? 'ดู ⌄' : 'ซ่อน ⌃') + '</button>' : '') +
        '</div>';
      if (collapsed) return;
      html += items.map(g === 3 ? miniRowHtml : cardHtml).join('');
    });
    list.innerHTML = html;
    layoutGroups = snapshotGroups(rows);
    pendingReorder = false;
    updateReorderBar();
  }

  /** Fingerprint of which group each row was in when the board was last laid out. */
  function snapshotGroups(rows) {
    var m = {};
    (rows || []).forEach(function (r) { m[r.orderId] = groupOf(r); });
    return m;
  }
  var layoutGroups = {};

  /**
   * Clocks advance every second, so rows would keep changing group under the
   * runner's thumb — and a list that reorders itself as someone reaches for a
   * button is how you press the wrong order and pay for it. The layout is held
   * still and a bar offers the reorder instead.
   */
  function updateReorderBar() {
    var bar = document.getElementById('learnBar');
    if (!pendingReorder) { if (bar.dataset.mode === 'reorder') { bar.style.display = 'none'; bar.dataset.mode = ''; } return; }
    bar.dataset.mode = 'reorder';
    document.getElementById('learnText').textContent = '↑ มีใบที่ควรกดก่อน — แตะเพื่อจัดใหม่';
    bar.style.display = 'flex';
    bar.onclick = function () { pendingReorder = false; render(); };
  }
  function hideLearnBar() {
    var bar = document.getElementById('learnBar');
    bar.style.display = 'none';
    if (bar.dataset.mode !== 'reorder') { try { localStorage.setItem('learnHidden', '1'); } catch (e) {} }
  }

  function toggleMenu(orderId) {
    var wasOpen = !!openMenus[orderId];
    openMenus = {};
    openMenus[orderId] = !wasOpen;
    render();
  }

  function showRules() {
    // Straight from SLA_BANDS_* in order-sla.js. The 15-minute rescue rule in
    // particular was invisible to the people it protects.
    toast('เกณฑ์: รับออเดอร์ช้า 5 นาที = 100฿ · 10 นาที = 200฿ · เกิน 15 นาที = ไม่หักคุณ (นับเป็นออเดอร์ค้างของร้าน)');
  }

  /** Ticks only the clock text, never the layout — re-rendering the list every
   *  second would wipe any open form and burn battery for nothing. */
  function tickClocks() {
    if (!allRows || currentTab === 'summary') return;
    var moved = false;
    allRows.forEach(function (r) {
      var el = document.getElementById('clk-' + r.orderId);
      if (!el) return;
      var c = clockFor(r);
      if (el.textContent !== c.text) el.textContent = c.text;
      if (el.className !== 'clock ' + c.tier) el.className = 'clock ' + c.tier;
      if (layoutGroups[r.orderId] !== undefined && layoutGroups[r.orderId] !== groupOf(r)) moved = true;
    });
    if (moved && !pendingReorder) { pendingReorder = true; updateReorderBar(); }
  }

  /** Skips a tick rather than queuing — a slow poll response and the next
   * timer firing at the same time is what made the page feel sluggish
   * (requests piling up in flight, each one racing to repaint last). */
  function refresh() {
    if (refreshing) return;
    // Never repaint over an open form. render() rebuilds list.innerHTML
    // wholesale, so an open form loses the amount being typed AND the chosen
    // <input type="file">: on a busy night someone else's button press
    // repaints the board every few seconds, and the runner mid-entry is told
    // "แนบรูปบิลก่อน" for a bill they just attached. Polling resumes as soon
    // as the form closes.
    if (Object.keys(openForms).length) return;
    if (!idToken) return; // not identified yet — the board now requires it
    refreshing = true;
    var myGeneration = boardGeneration;
    var pending = firstBoard || callApi('listOrderStatusRows', { idToken: idToken, accessToken: accessToken, requestGroupId: REQUEST_GROUP });
    firstBoard = null;
    pending.then(function (rows) {
      if (myGeneration !== boardGeneration) return; // a write landed mid-flight; this data predates it
      if (!rows || rows.error) { showOffline(rows && rows.error); return; }
      noteServerNow(rows);
      allRows = rows;
      // Re-rendering identical data throws away every open form's typed
      // amount and re-decodes the same HTML — repaint only on a real change.
      clearOffline();
      var payload = JSON.stringify(rows);
      if (payload !== lastPayload) { lastPayload = payload; render(); }
      document.getElementById('lastUpdated').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH');
    }).catch(function () {
      showOffline();
    }).finally(function () { refreshing = false; });
  }

  /** Anchors the local clock to the server's, so countdowns survive a bad phone clock and a dead connection. */
  function noteServerNow(rows) {
    var stamp = rows && rows.length && rows[0].serverNow;
    if (!stamp) return;
    var t = Date.parse(String(stamp).replace(' ', 'T'));
    if (isNaN(t)) return;
    serverNowMs = t;
    serverNowLocal = performance.now();
  }

  /**
   * "The app is dead" has to be impossible to miss. It used to be written into
   * an 11px muted line UNDER the whole list — on a busy night that is four
   * screens down, so nobody ever saw it and runners stood watching a frozen
   * board believing there was simply no new work.
   *
   * The stale data stays on screen: they still need it to go and fetch things.
   * They just have to know it is stale — and the clocks keep counting, because
   * the fines do not pause when the wifi does.
   */
  function showOffline(message) {
    failedFetches++;
    // A message from the server is a definite answer, not a flaky connection —
    // show it at once. Sitting silently on skeleton cards (which is what the
    // page did) tells the runner nothing at all.
    if (!message && failedFetches < 2 && navigator.onLine !== false) return;
    if (allRows === null) {
      document.getElementById('list').innerHTML =
        '<div class="empty">โหลดรายการไม่สำเร็จ<br><span style="font-size:14px">' + esc(message || 'เชื่อมต่อไม่ได้') + '</span></div>';
    }
    var bar = document.getElementById('offlineBar');
    var since = serverNowMs ? Math.floor((performance.now() - serverNowLocal) / 60000) : 0;
    document.getElementById('offlineText').textContent = message ||
      ('⚠ ไม่ได้เชื่อมต่อ · ข้อมูลเมื่อ ' + (since < 1 ? 'ไม่ถึง 1' : since) + ' นาทีที่แล้ว — ตัวเลขบนจออาจไม่ตรง');
    bar.style.display = 'flex';
  }
  function clearOffline() {
    failedFetches = 0;
    document.getElementById('offlineBar').style.display = 'none';
  }

  /**
   * A write just landed. Two things have to happen, in this order:
   *
   * 1. Move the card forward LOCALLY and repaint right now. The server already
   *    accepted the change, so the new stage is a fact — making the runner
   *    stare at the old status until a round trip completes is what made the
   *    app feel broken ("บันทึกแล้วแต่สถานะไม่เปลี่ยน ต้องเข้าออกใหม่").
   * 2. Then confirm against the server with `fresh: true`, bypassing the
   *    8-second shared cache, so the optimistic guess is replaced by truth.
   */
  function applyLocalStage(orderId, stage) {
    boardGeneration++; // every poll already in flight is now stale
    if (!allRows) return;
    allRows.forEach(function (r) {
      if (r.orderId === orderId && stage > r.stage) r.stage = stage;
    });
    lastPayload = ''; // the next server payload must repaint over this guess
    render();
  }

  function forceRefresh() {
    lastPayload = '';
    boardGeneration++;
    refreshing = true; // deliberately overrides an in-flight poll: this request is the authoritative one
    var myGeneration = boardGeneration;
    return callApi('listOrderStatusRows', { idToken: idToken, accessToken: accessToken, requestGroupId: REQUEST_GROUP, fresh: true }).then(function (rows) {
      if (myGeneration !== boardGeneration) return;
      if (!rows || rows.error) return;
      noteServerNow(rows);
      clearOffline();
      allRows = rows;
      lastPayload = JSON.stringify(rows);
      render();
      document.getElementById('lastUpdated').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH');
    }).catch(function () {
      // The optimistic repaint above still stands — say nothing, the next poll retries.
    }).finally(function () { refreshing = false; });
  }

  // Polling only runs while the page is actually on screen. The old version
  // kept a 10s timer alive in the background: every minute a backgrounded
  // webview burned six pointless round trips, and coming back to the app meant
  // waiting behind that queue.
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      if (currentTab === 'summary') return;
      refresh();
    }, 10000);
  }
  /** Teaches the one thing that actually costs money, and only for the first couple of shifts. */
  function showLearnBarIfNew() {
    var hidden = false;
    try { hidden = localStorage.getItem('learnHidden') === '1'; } catch (e) {}
    if (hidden) return;
    var bar = document.getElementById('learnBar');
    document.getElementById('learnText').innerHTML =
      '💡 "รับออเดอร์" = บอกระบบว่าคุณจะไปเอาให้ · กดแล้วนาฬิกาแคชเชียร์หยุดทันที';
    bar.style.display = 'flex';
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function withButtonBusy(orderId, label, fn) {
    var btn = document.getElementById(orderId);
    if (btn) {
      btn.disabled = true;
      btn.dataset.orig = btn.textContent;
      btn.textContent = label;
      btn.classList.add('busy');
    }
    if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} }
    return fn().finally(function () {
      if (btn) {
        btn.disabled = false;
        btn.textContent = btn.dataset.orig || btn.textContent;
        btn.classList.remove('busy');
      }
    });
  }

  /** Marks a card as "shown, not yet confirmed" with a left edge — a shape, not a colour. */
  function markPending(orderId, state) {
    var card = document.getElementById('card-' + orderId);
    if (!card) return;
    card.classList.remove('pending', 'failed');
    if (state) card.classList.add(state);
  }

  function doClaim(orderId) {
    withButtonBusy('btn-' + orderId, 'กำลังรับ...', function () {
      return callApi('claimOrderViaLiff', { idToken: idToken, accessToken: accessToken, orderId: orderId }).then(function (r) {
        if (!r.ok) { toast(r.reason || r.error || 'บันทึกไม่สำเร็จ ใบนี้ยังไม่มีใครรับ ลองกดอีกครั้ง', true); return; }
        toast('รับออเดอร์ ' + orderId + ' แล้ว');
        applyLocalStage(orderId, 1); // รอร้านรับ -> เตรียมอาหาร, on screen immediately
        markPending(orderId, 'pending');   // shown, not yet confirmed by the server
        forceRefresh().then(function () { markPending(orderId, ''); },
                            function () { markPending(orderId, 'failed'); });
      });
    });
  }

  function doNudge(orderId) {
    withButtonBusy('nudge-' + orderId, 'กำลังเตือน...', function () {
      return callApi('nudgeOrderViaLiff', { idToken: idToken, accessToken: accessToken, orderId: orderId }).then(function (r) {
        if (!r.ok) { toast(r.error || 'เตือนไม่สำเร็จ', true); return; }
        toast('เตือนผู้จัดการร้านแล้ว');
      });
    });
  }

  function loadSummary() {
    callApi('monthToDateSummaryViaLiff', creds()).then(function (s) {
      summary = s;
      if (currentTab === 'summary') renderSummary();
    }).catch(function () { toast('โหลดสรุปไม่สำเร็จ', true); });
  }

  function doComplete(orderId) {
    withButtonBusy('btn-' + orderId, 'กำลังบันทึก...', function () {
      return callApi('completeOrderDeliveryViaLiff', { idToken: idToken, accessToken: accessToken, orderId: orderId }).then(function (r) {
        if (!r.ok) { toast(r.reason || r.error || 'ผิดพลาด', true); return; }
        toast('ส่งมอบ ' + orderId + ' เรียบร้อย');
        applyLocalStage(orderId, 3);
        markPending(orderId, 'pending');
        forceRefresh().then(function () { markPending(orderId, ''); },
                            function () { markPending(orderId, 'failed'); });
      });
    });
  }

  function submitWithPhoto(orderId, fn, nextStage) {
    var amount = document.getElementById('amt-' + orderId).value;
    var payment = document.getElementById('pay-' + orderId).value;
    var fileInput = document.getElementById('photo-' + orderId);
    var files = Array.prototype.slice.call(fileInput.files || []).slice(0, 3);
    var errEl = document.getElementById('err-' + orderId);
    var submitBtn = document.getElementById('submit-' + orderId);
    errEl.textContent = '';
    if (!amount) { errEl.textContent = '⚠ ใส่ยอดเงินที่จ่ายจริงตามบิล'; return; }
    if (!files.length) { errEl.textContent = '⚠ ถ่ายรูปบิลก่อนบันทึก — ไม่มีบิลจะเคลียร์ยอดสิ้นเดือนไม่ได้'; return; }
    submitBtn.disabled = true;
    errEl.textContent = 'กำลังเตรียมรูป...';
    shrinkAll(files, function (dataUrls) {
      // shrinkPhoto falls back to the ORIGINAL file when canvas fails (out of
      // memory on an older phone with a 12MP photo). A 4MB original becomes
      // ~5.5MB of base64 over hotel wifi and simply times out, and the runner
      // only ever saw "ส่งไม่สำเร็จ" with no idea why. Refuse it with a
      // reason they can act on instead.
      var tooBig = dataUrls.filter(function (u) { return u && u.length > 3000000; });
      if (tooBig.length) {
        submitBtn.disabled = false;
        errEl.textContent = '⚠ รูปใหญ่เกินไป ถ่ายใหม่ให้เห็นเฉพาะใบบิล ไม่ต้องติดโต๊ะ';
        return;
      }
      // 90 seconds of a static 'กำลังส่ง...' is why bills go missing: at about
      // 15 seconds of nothing moving, people close the app, the upload aborts,
      // and the whole thing starts over. A number that ticks is the proof it
      // is still alive.
      var startedAt = Date.now();
      errEl.style.color = 'var(--ink-2)';
      var uploadTimer = setInterval(function () {
        var sec = Math.floor((Date.now() - startedAt) / 1000);
        errEl.innerHTML = 'กำลังส่งบิล… ' + sec + ' วิ<br>' +
          '<span style="color:var(--warn-ink);font-weight:600">ไวไฟโรงแรมช้า อาจใช้เวลาถึง 1 นาที · ปิดหน้านี้แล้วรูปจะหาย</span>';
      }, 1000);
      errEl.textContent = 'กำลังส่งบิล… 0 วิ';
      callApi(fn, {
        idToken: idToken, accessToken: accessToken, liffSource: 'order', ticketId: orderId,
        amount: amount, payment: payment,
        photoDataUrls: dataUrls.filter(Boolean),
      }).then(function (r) {
        clearInterval(uploadTimer);
        errEl.style.color = '';
        submitBtn.disabled = false;
        if (!r.ok) { errEl.textContent = r.error || 'ผิดพลาด'; return; }
        toast('บันทึก ' + orderId + ' เรียบร้อย');
        openForms = {};
        applyLocalStage(orderId, nextStage);
        forceRefresh();
      }).catch(function () {
        clearInterval(uploadTimer);
        errEl.style.color = '';
        submitBtn.disabled = false;
        errEl.textContent = '⚠ ส่งบิลไม่สำเร็จ รูปยังอยู่ในเครื่อง กดบันทึกอีกครั้งได้เลย ไม่ต้องถ่ายใหม่';
      });
    });
  }
  // รับอาหาร leaves the order at "กำลังจัดส่ง" (2) — one more press to go.
  // ส่งแล้ว (non-24BLVD) is terminal, so it lands on "ส่งมอบแล้ว" (3).
  /** Shrinks each picked file in turn and hands back the finished data URLs. */
  function shrinkAll(files, done) {
    var out = [];
    (function next(i) {
      if (i >= files.length) return done(out);
      shrinkPhoto(files[i], function (dataUrl) { out.push(dataUrl); next(i + 1); });
    })(0);
  }

  function submitFood(orderId) { submitWithPhoto(orderId, 'submitOrderFoodForm', 2); }
  function submitDeliverForm(orderId) { submitWithPhoto(orderId, 'submitOrderFulfillForm', 3); }

  function selectTab(tab) {
    currentTab = tab;
    ['Mine', 'All', 'Summary', 'Manager'].forEach(function (name) {
      document.getElementById('tab' + name).classList.toggle('active', tab === name.toLowerCase());
    });
    // The summary is a separate, heavier query — fetched the first time the
    // tab is opened rather than on every 10-second poll of the order list.
    if (tab === 'summary' && !summary) loadSummary();
    render();
  }
  document.getElementById('tabMine').addEventListener('click', function () { selectTab('mine'); });
  document.getElementById('tabAll').addEventListener('click', function () { selectTab('all'); });
  document.getElementById('tabSummary').addEventListener('click', function () { summary = null; selectTab('summary'); });
  document.getElementById('tabManager').addEventListener('click', function () {
    if (!managerMonthKey) managerMonthKey = thisMonthKey_();
    managerLeaderboard = null;
    managerRecon = null;
    selectTab('manager');
    loadManagerLeaderboard();
    loadManagerRecon();
  });

  // Pausing the poll while the tab/webview is hidden (backgrounded) saves
  // requests and means the page doesn't come back to a burst of stale-timer
  // catch-up traffic — check once immediately on return instead.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') forceRefresh();
  });

  // The shell (with skeleton cards) goes up immediately, but the data now
  // waits for liff.init() — the board is private, see the security note in
  // order-liff-api.js.
  showApp();

  function showApp() {
    document.getElementById('buildTag').textContent = BUILD;
    document.getElementById('boot').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    if (REQUEST_GROUP) {
      // Scoped to one request: "ต้องทำ" would hide the shops already handled,
      // which is the opposite of what someone following their own order wants.
      currentTab = 'all';
      document.getElementById('tabMine').classList.remove('active');
      document.getElementById('tabAll').classList.add('active');
      var banner = document.getElementById('scopeBanner');
      banner.innerHTML = '<span>📦 กำลังดูเฉพาะคำขอ ' + esc(REQUEST_GROUP) + '</span>' +
        '<a href="' + esc(location.pathname) + '">ดูทั้งหมด</a>';
      banner.style.display = 'flex';
    }
    render();
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    idToken = liff.getIDToken() || '';
    try { accessToken = liff.getAccessToken() || ''; } catch (e) { accessToken = ''; }
    if (!idToken && !accessToken) {
      // No credential, no board: the payload carries guest room numbers. There
      // is no "view only" mode any more — buttons that can only ever fail just
      // teach staff the system is broken.
      authState = 'none';
      document.getElementById('whoLine').textContent = 'ยังไม่ได้ยืนยันตัวตน';
      render();
      return;
    }
    authState = 'ok';
    refresh();
    startPolling();
    // Clock text only; the layout is left alone (see tickClocks).
    if (!clockTimer) clockTimer = setInterval(tickClocks, 1000);
    showLearnBarIfNew();
    // Profile photo is a nicety — never let a failed fetch cost us the page.
    liff.getProfile().then(function (p) {
      if (p && p.pictureUrl) {
        var img = document.getElementById('avatar');
        img.src = p.pictureUrl;
        img.style.display = 'block';
      }
    }).catch(function () {});
    callApi('whoAmIViaLiff', { idToken: idToken, accessToken: accessToken }).then(function (whoami) {
      if (!whoami || !whoami.userId) { document.getElementById('whoLine').textContent = 'ยืนยันตัวตนไม่สำเร็จ'; return; }
      me = whoami;
      document.getElementById('whoLine').textContent = me.actorName + ' (' + me.role + ')';
      // The backend re-checks this on every manager call regardless — this
      // only decides whether the tab is worth showing at all.
      if (me.role === 'manager' || me.role === 'venue_manager') {
        document.getElementById('tabManager').style.display = '';
      }
      render(); // re-filter "ต้องทำ" now that me.userId is known
    });
  }).catch(function (err) {
    // The board is already on screen — a LIFF failure costs identity (and so
    // the action buttons), not the whole page.
    authState = 'none';
    document.getElementById('whoLine').textContent = 'เชื่อมต่อไลน์ไม่สำเร็จ';
    render();
    console.error(err);
  });
</script>
</body>
</html>
