    // Filtering the response here instead is what produced a headline figure
    // for all ten orders under the words "กำลังดู: Fairway" (Phase 14 §1).
    var venues = venuesForQuery();
    if (venues.length) payload.shops = venues;
    if (salesRange === 'custom') { payload.from = salesFrom; payload.to = salesTo; }
    callApi('orderSalesSummaryViaLiff', payload).then(function (s) {
      if (!s || s.error) { if (force) toast(s && s.error ? s.error : 'โหลดยอดขายไม่สำเร็จ', true); return; }
      sales = s;
      // The clock the panel prints: when these figures were last fetched, so
      // "สดตอนนี้" is a claim the page can be held to rather than a word.
      var now = new Date();
      var pad2 = function (n) { return n < 10 ? '0' + n : '' + n; };
      lastSalesAt = pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());
      var json = JSON.stringify(s);
      if (force || json !== lastSalesPayload) {
        lastSalesPayload = json;
        if (currentTab === 'summary') renderSummary();
      }
    }).catch(function () {
      if (force) toast('โหลดยอดขายไม่สำเร็จ', true);
    }).finally(function () { salesLoading = false; });
  }

  function setSalesRange(key) {
    salesRange = key;
    if (key === 'custom' && !salesFrom) {
      // Seed the pickers with today so the two fields are never both empty —
      // an empty date range submits as "today" server-side anyway, and showing
      // that up front is less confusing than two blank boxes.
      var t = new Date();
      var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
      salesTo = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
      salesFrom = salesTo;
    }
    sales = null;
    lastSalesPayload = '';
    renderSummary();
    if (key !== 'custom' || (salesFrom && salesTo)) loadSales(true);
  }

  document.getElementById('list').addEventListener('click', function (e) {
    var shopRow = e.target.closest('[data-shop-row]');
    if (shopRow) {
      toggleShop(shopRow.getAttribute('data-shop-row') || '');
      filtersChanged();
      return;
    }
    var chip = e.target.closest('.rangeChip');
    if (!chip) return;
    setSalesRange(chip.getAttribute('data-range'));
  });
  document.getElementById('list').addEventListener('change', function (e) {
    if (e.target.id !== 'salesFrom' && e.target.id !== 'salesTo') return;
    salesFrom = document.getElementById('salesFrom').value;
    salesTo = document.getElementById('salesTo').value;
    if (salesFrom && salesTo) loadSales(true);
  });

  // doComplete() lived here: a one-tap close for 24BLVD that wrote no bill and
  // no amount, because both used to be captured at the kitchen step. They are
  // captured at handover now, so every close goes through the form and the
  // backend refuses a 24BLVD order that arrives without a bill. Removed rather
  // than left unused — a spare one-tap close is exactly the thing that gets
  // wired back to a button later.

  // ---- Two-phase save (owner, 2026-09-18: "Save takes 10–20 s") ----
  //
  // Phase 1 sends the facts (time, amount, payment, who) with no photo and
  // answers in ~2 s: the button unlocks, the card moves, the runner walks
  // away. Phase 2 shrinks and uploads the photos in the background with
  // retries, and a strip at the top says what is still on its way. The
  // server sends the Delivered card when the handover photo lands (or from
  // its 5-minute sweep if it never does), so nothing is lost by splitting.
  var pendingUploads = {}; // orderId -> {label, attempt, status, retry}
  function renderUploadStrip() {
    var el = document.getElementById('uploadStrip');
    if (!el) return;
    var ids = Object.keys(pendingUploads);
    if (!ids.length) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.innerHTML = ids.map(function (id) {
      var u = pendingUploads[id];
      var short = id.replace(/^ORD_\d{8}_/, '#');
      if (u.status === 'failed') {
        return '<div class="upl bad">📷 ' + short + ' — photo NOT sent after ' + u.attempt + ' tries. <button data-upl-retry="' + id + '">Retry</button> <span class="dim">Keep this page open.</span></div>';
      }
      return '<div class="upl">📷 Sending ' + u.label + ' for ' + short + '… ' + Math.floor((Date.now() - u.startedAt) / 1000) + ' s' + (u.attempt > 1 ? ' (try ' + u.attempt + ')' : '') + '</div>';
    }).join('');
  }
  setInterval(function () { if (Object.keys(pendingUploads).length) renderUploadStrip(); }, 1000);
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-upl-retry]');
    if (!b) return;
    var u = pendingUploads[b.getAttribute('data-upl-retry')];
    if (u && u.retry) u.retry();
  });
  window.addEventListener('beforeunload', function (e) {
    var busy = Object.keys(pendingUploads).filter(function (id) { return pendingUploads[id].status !== 'failed'; });
    if (!busy.length) return;
    e.preventDefault(); e.returnValue = 'A photo is still uploading';
    return e.returnValue;
  });

  function uploadInBackground(orderId, fn, payloadBase, label) {
    var u = pendingUploads[orderId] = { label: label, attempt: 0, status: 'sending', startedAt: Date.now() };
    function go() {
      u.attempt++; u.status = 'sending'; u.startedAt = Date.now(); renderUploadStrip();
      callApi(fn, payloadBase).then(function (r) {
        if (!r || !r.ok) throw new Error((r && r.error) || 'upload failed');
        delete pendingUploads[orderId]; renderUploadStrip();
        toast('📷 Photo sent for ' + orderId.replace(/^ORD_\d{8}_/, '#'));
        forceRefresh();
      }).catch(function () {
        if (u.attempt < 3) { setTimeout(go, 3000 * u.attempt); return; }
        u.status = 'failed'; renderUploadStrip();
      });
    }
    u.retry = function () { u.attempt = 0; go(); };
    go();
  }

  function submitWithPhoto(orderId, fn, nextStage, kind) {
    var isKitchen = kind === 'kitchen';
    var amountEl = document.getElementById('amt-' + orderId);
    var paymentEl = document.getElementById('pay-' + orderId);
    var foodEl = document.getElementById('food-' + orderId);
    var amount = amountEl ? amountEl.value : '';
    var payment = paymentEl ? paymentEl.value : '';
    var fileInput = document.getElementById('photo-' + orderId);
    var files = Array.prototype.slice.call(fileInput.files || []).slice(0, 3);
    var foodFiles = foodEl ? Array.prototype.slice.call(foodEl.files || []).slice(0, 1) : [];
    var errEl = document.getElementById('err-' + orderId);
    var submitBtn = document.getElementById('submit-' + orderId);
    errEl.textContent = '';
    if (!isKitchen && !amount) { errEl.textContent = '⚠ Enter the amount paid'; return; }
    // The photos are still required before Save — nobody may skip them —
    // they just do not hold the button any more.
    if (!isKitchen && !foodFiles.length) { errEl.textContent = '⚠ No photo of the food yet'; return; }
    if (!files.length) {
      errEl.textContent = isKitchen
        ? '⚠ Take one photo of the food before you confirm'
        : '⚠ No photo of the bill yet — the month cannot be settled without it';
      return;
    }
    if (alreadySavedHere(orderId, nextStage)) { toast('Already saved ' + orderId.replace(/^ORD_\d{8}_/, '#') + ' — the board is catching up, no need to press again'); openForms = {}; render(); return; }
    submitBtn.disabled = true;
    errEl.style.color = 'var(--ink-2)';
    errEl.textContent = 'Saving…';
    var base = { idToken: idToken, accessToken: accessToken, liffSource: 'order', ticketId: orderId };
    var phase1 = Object.assign({ stampOnly: true }, base);
    if (!isKitchen) { phase1.amount = amount; phase1.payment = payment; }
    var t0 = Date.now();
    callApi(fn, phase1).then(function (r) {
      // A Save the server finished in 6.6 s took ~27 s to reach the phone
      // (video, 2026-09-18 17:56). Only the phone can see that gap.
      var e2e = Date.now() - t0;
      if (e2e > 8000 && r && r._ms) clientLog('slow save ' + fn + ' e2e ' + Math.round(e2e / 1000) + 's, server ' + Math.round(r._ms / 1000) + 's');
      errEl.style.color = '';
      submitBtn.disabled = false;
      if (!r || !r.ok) { errEl.textContent = (r && r.error) || 'Something went wrong'; return; }
      toast('✅ Saved ' + orderId.replace(/^ORD_\d{8}_/, '#') + ' in ' + Math.round((Date.now() - t0) / 1000) + ' s — photo sending in the background');
      openForms = {};
      applyLocalStage(orderId, nextStage);
      forceRefresh();
      // v36: the stamp answered without publishing (server rule 38) — this
      // call is what moves every other phone. Fire-and-forget; the 5-minute
      // sweep covers a phone that dies here.
      publishBoardAfterWrite();
      // Phase 2, off the button: shrink, then upload with retries.
      shrinkAll(files.concat(foodFiles), function (allUrls) {
        var dataUrls = allUrls.slice(0, files.length).filter(Boolean);
        var foodUrls = allUrls.slice(files.length).filter(Boolean);
        var tooBig = dataUrls.concat(foodUrls).filter(function (u) { return u && u.length > 3000000; });
        if (tooBig.length) { pendingUploads[orderId] = { label: 'photo', attempt: 3, status: 'failed', startedAt: Date.now(), retry: function () { toast('Retake the photo showing just the bill', true); } }; renderUploadStrip(); return; }
        if (isKitchen) {
          uploadInBackground(orderId, 'submitOrderFoodForm', Object.assign({ photoDataUrls: dataUrls }, base), 'food photo');
        } else {
          uploadInBackground(orderId, 'submitOrderFulfillPhotos', Object.assign({ billPhotoDataUrls: dataUrls, foodPhotoDataUrls: foodUrls }, base), 'food + bill photos');
        }
      });
    }).catch(function () {
      // The stamp request died — but it may have landed. Ask before making
      // the runner press again and then reading "already delivered".
      errEl.style.color = 'var(--ink-2)';
      errEl.textContent = 'Checking whether it got through…';
      callApi('listOrderStatusRows', { idToken: idToken, accessToken: accessToken, requestGroupId: REQUEST_GROUP, fresh: true }).then(function (rows) {
        var row = (rows || []).filter(function (x) { return x && x.orderId === orderId; })[0];
        if (row && row.stage >= nextStage) {
          errEl.style.color = ''; errEl.textContent = '';
          toast('✅ Saved ' + orderId + ' — the reply was lost on the way, but it is done. Tap Save again to send the photo.');
          openForms = {}; applyLocalStage(orderId, nextStage); forceRefresh();
          return;
        }
        throw new Error('not saved');
      }).catch(function () {
        errEl.style.color = '';
        submitBtn.disabled = false;
        errEl.textContent = '⚠ Could not save. Tap Save again — the photos are still on your phone.';
      });
    });
  }
  // รับอาหาร leaves the order at "กำลังจัดส่ง" (2) — one more press to go.
  // ส่งแล้ว (non-24BLVD) is terminal, so it lands on "ส่งมอบแล้ว" (3).
  /** Shrinks each picked file in turn and hands back the finished data URLs. */
  function shrinkAll(files, done) {
    var out = [];
    (function next(i) {
      if (i >= files.length) return done(out);
      shrinkPhoto(files[i], function (dataUrl) { out.push(dataUrl); next(i + 1); });
    })(0);
  }

  // The stage each press lands on. These were 2 and 3 — the numbers from the
  // four-stage board before the claim step went — and nothing complained:
  // applyLocalStage only ever raises, so a food press painted the row as
  // delivered until the next poll, and the timed-out-Save check for a
  // delivery compared against a stage that does not exist. Named, not typed.
  var STAGE_READY = 1;
  function submitFood(orderId) { submitWithPhoto(orderId, 'submitOrderFoodForm', STAGE_READY, 'kitchen'); }
  function submitDeliverForm(orderId) { submitWithPhoto(orderId, 'submitOrderFulfillForm', STAGE_DONE, 'handover'); }

  function selectTab(tab) {
    currentTab = tab;
    ['All', 'Summary', 'Manager'].forEach(function (name) {
      document.getElementById('tab' + name).classList.toggle('active', tab === name.toLowerCase());
    });
    // The summary is a separate, heavier query — fetched the first time the
    // tab is opened rather than on every 10-second poll of the order list.
    if (tab === 'summary' && !summary) loadSummary();
    if (tab === 'summary' && !sales) loadSales(true);
    render();
  }
  document.getElementById('tabAll').addEventListener('click', function () { selectTab('all'); });
  document.getElementById('tabSummary').addEventListener('click', function () {
    // Both caches cleared, not just `summary`: leaving `sales` populated meant
    // "!sales" in selectTab was false and switching away and back never
    // refetched, so the figures could be arbitrarily old with nothing on
    // screen saying so.
    summary = null;
    sales = null;
    lastSalesPayload = '';
    selectTab('summary');
  });
  document.getElementById('tabManager').addEventListener('click', function () {
    if (!managerMonthKey) managerMonthKey = thisMonthKey_();
    managerLeaderboard = null;
    managerRecon = null;
    appeals = null;
    selectTab('manager');
    loadManagerLeaderboard();
    loadManagerRecon();
    loadAppeals();
  });

  // Pausing the poll while the tab/webview is hidden (backgrounded) saves
  // requests and means the page doesn't come back to a burst of stale-timer
  // catch-up traffic — check once immediately on return instead.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') forceRefresh();
  });

  // The shell (with skeleton cards) goes up immediately, but the data now
  // waits for liff.init() — the board is private, see the security note in
  // order-liff-api.js.
  showApp();

  function showApp() {
    document.getElementById('buildTag').textContent = BUILD;
    document.getElementById('boot').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    // This phone's own last board, painted before LINE has even answered.
    // The countdowns wait for a real serverNow (they read as "—" until then).
    if (staleBoard && allRows === null) {
      allRows = staleBoard.rows;
      lastPayload = JSON.stringify(staleBoard.rows);
      // Provisional clock: the server time we last knew plus how long this
      // phone says has passed. whoAmI replaces it with a fresh anchor.
      if (staleBoard.serverNowMs && !serverNowMs) {
        serverNowMs = staleBoard.serverNowMs + (Date.now() - staleBoard.at);
        serverNowLocal = performance.now();
      }
      document.getElementById('lastUpdated').textContent = 'From ' + Math.max(1, Math.round((Date.now() - staleBoard.at) / 60000)) + ' min ago — updating…';
    }
    if (REQUEST_GROUP) {
      currentTab = 'all';
      document.getElementById('tabAll').classList.add('active');
      var banner = document.getElementById('scopeBanner');
      banner.innerHTML = '<span>📦 Showing one order group: ' + esc(REQUEST_GROUP) + '</span>' +
        '<a href="' + esc(location.pathname) + '">Show all</a>';
      banner.style.display = 'flex';
    }
    render();
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    idToken = liff.getIDToken() || '';
    try { accessToken = liff.getAccessToken() || ''; } catch (e) { accessToken = ''; }
    if (!idToken && !accessToken) {
      // No credential, no board: the payload carries guest room numbers. There
      // is no "view only" mode any more — buttons that can only ever fail just
      // teach staff the system is broken.
      authState = 'none';
      document.getElementById('whoLine').textContent = 'Not signed in';
      render();
      return;
    }
    authState = 'ok';
    lastPayload = ''; // a stale board on screen must be repainted by the first real one even if identical-looking
    refresh();
    startPolling();
    // Clock text only; the layout is left alone (see tickClocks).
    if (!clockTimer) clockTimer = setInterval(tickClocks, 1000);
    showLearnBarIfNew();
    // Profile photo is a nicety — never let a failed fetch cost us the page.
    liff.getProfile().then(function (p) {
      if (p && p.pictureUrl) {
        var img = document.getElementById('avatar');
        img.src = p.pictureUrl;
        img.style.display = 'block';
      }
    }).catch(function () {});
    callApi('whoAmIViaLiff', { idToken: idToken, accessToken: accessToken, clientMs: Math.round(performance.now()) }).then(function (whoami) {
      if (!whoami || !whoami.userId) { document.getElementById('whoLine').textContent = 'Could not confirm who you are'; return; }
      me = whoami;
      // Every selling shop, so the chips list LULU / BESO / NOT IN BANGKOK on a
      // day nobody has ordered from them yet (Chef Earth, 2026-09-18).
      if (whoami.shopZones && Object.keys(whoami.shopZones).length) {
        shopDirectory = whoami.shopZones;
        try { localStorage.setItem('davis_shop_dir', JSON.stringify(shopDirectory)); } catch (e) {}
        lastPayload = ''; render();
      }
      // The clock anchor comes from here (a fresh request), never from a board snapshot.
      if (whoami.serverNow) noteServerNow([{ serverNow: whoami.serverNow }]);
      startRealtime(whoami);
      // `label` comes from the backend and already says the right thing for an
      // unrecognised user; the page was printing a bare name and role instead.
      document.getElementById('whoLine').textContent = me.label || (me.actorName + ' (' + me.role + ')');
      renderUnknownIdentity();
      renderQuotaWarning();
      // The backend re-checks this on every manager call regardless — this
      // only decides whether the tab is worth showing at all.
      if (me.canSeeSales || me.role === 'manager' || me.role === 'venue_manager') {
        document.getElementById('tabManager').style.display = '';
      }
      // Phase 19: a kitchen hand opens on their own shop's queue. Only when
      // they have not chosen shops themselves — the chips still work.
      if (me.isKitchen && !me.isRunner && me.venues && me.venues.length && !shopFilters.length) {
        shopFilters = me.venues.slice();
      }
      var bell = document.getElementById('bellBtn');
      if (bell) bell.textContent = soundOn ? '🔔' : '🔕';
      // The brief card's "ดูรายละเอียด" deep link. Applied here rather than at
      // boot because the sales panel is manager-only — the role is not known
      // until whoAmI comes back, and jumping a 'staff' user to a tab whose
      // main content they cannot load would just show them an error.
      if (INITIAL_TAB === 'summary' && isSalesViewer()) {
        if (INITIAL_RANGE) salesRange = INITIAL_RANGE;
        selectTab('summary');
        return;
      }
      render(); // redraw now that me.userId is known — the action buttons need it
    });
  }).catch(function (err) {
    // The board is already on screen — a LIFF failure costs identity (and so
    // the action buttons), not the whole page.
    authState = 'none';
    document.getElementById('whoLine').textContent = 'Could not connect to LINE';
    render();
    console.error(err);
  });
</script>
</body>
</html>
