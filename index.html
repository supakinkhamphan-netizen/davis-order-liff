<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- LINE's in-app webview caches this page hard: an upload can be live on the
     server while a phone still runs the previous build, which looks exactly
     like "the fix didn't work". Ask it not to. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Davis Order</title>
<!-- The API host is the one thing every screen waits on — get DNS/TLS out of
     the way while the HTML is still parsing. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded non-blocking: a webfont must never hold up first paint on a phone
     on hotel wifi. The system stack below renders immediately and Inter swaps
     in when it arrives. -->
<!-- IBM Plex Sans Thai, not Inter. Inter has no Thai glyphs at all, so this
     almost entirely Thai UI was downloading a full webfont it could not use,
     then falling back to a system Thai face — and `font-weight:800` on that
     face is synthesised bold, which smears the vowel and tone marks stacked
     above and below the consonants on a low-resolution screen. Plex Thai
     carries Thai, Latin and figures in one family, so a line mixing a room
     number and a Thai word finally sits on one baseline. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* Phase 12 §4 — dark unconditionally, not only when the phone happens to be
     in dark mode.
     The dark values already existed, but lived inside a
     @media (prefers-color-scheme: dark) block, so a phone set to light — which
     is most of them — got the white page the owner photographed. The cards in
     LINE are dark in both LINE themes (Phase 9 §4.4.6), and the whole point was
     that every member of staff sees the same thing; a board that follows the
     handset breaks that and blinds whoever opens it at 01:00 in a dark bar.
     Same values as ORDER_DARK_ in line-core.js, so board, cards and forms are
     one product. */
  :root {
    color-scheme: dark;   /* scrollbars, and any control the browser draws itself */
    /* ORDER_TONE_ (line-core.js in the bot repo) — the same seven values as
       every LINE card and form. The board is the one surface that can draw
       the soft light this tone is built on, so it does: --hi/--lo are the
       neumorphic pair, raised on cards and buttons, inset on fields and chips. */
    --bg:#23272E; --card:#23272E; --panel:#262B33; --line:#2F353E;
    --ink:#E8EBF0;
    --ink-2:#9AA3B2;
    --ink-3:#E8EBF0;   /* the order items — the thing being fetched */
    --ok:#6FD39A;
    --accent:#2FA39A; --accent-ink:#08201E;
    --warn-bg:#3A3116; --warn-ink:#E3B341;
    --hot-bg:#3D2A1C;  --hot-ink:#F0B48C;
    --free-bg:#1F2A3F; --free-ink:#93C5FD;
    --danger:#F08C8C;
    --hi:rgba(255,255,255,.055); --lo:rgba(0,0,0,.55);
    --raise:6px 6px 14px var(--lo), -4px -4px 12px var(--hi);
    --raise-sm:3px 3px 8px var(--lo), -2px -2px 6px var(--hi);
    --sink:inset 4px 4px 10px var(--lo), inset -3px -3px 8px var(--hi);
    --btn-h:56px; --btn-r:12px; --card-r:16px; --gap:12px; --pad:16px;
    --head-h:64px; --tabs-h:48px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'IBM Plex Sans Thai',-apple-system,'Helvetica Neue',sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; padding-bottom:70px; }
  header { background:var(--bg); color:var(--ink); padding:0 16px; height:var(--head-h); display:flex; align-items:center; position:sticky; top:0; z-index:6; box-shadow:0 6px 14px var(--lo); }
  header h1 { font-weight:800; font-size:1.2rem; margin:0; }
  header .who { font-size:12px; color:var(--ink-2); margin-top:3px; min-height:15px; }
  header .headRow { display:flex; align-items:center; gap:12px; }
  header #avatar { width:42px; height:42px; border-radius:50%; object-fit:cover; background:#333; display:none; }
  .nudgeBtn { margin-top:8px; width:100%; min-height:38px; border:none; border-radius:10px; background:var(--card); color:var(--ink); font-size:13px; font-weight:600; box-shadow:var(--raise-sm); }
  .sumRow { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .sumRow:last-child { border-bottom:none; }
  .sumTotal { display:flex; justify-content:space-between; padding:14px 0 0; font-weight:800; font-size:16px; }
  /* top must equal the header's real height or the tab bar slides up under it
     while scrolling — it was pinned at 56px against a ~70px header. Both now
     come from the same token. */
  .tabs { display:flex; height:var(--tabs-h); position:sticky; top:var(--head-h); background:var(--bg); z-index:5; box-shadow:0 1px 0 var(--line); }
  .tabs button { flex:1; border:none; background:none; padding:12px; font-size:15px; font-weight:600; color:var(--ink-2); font-family:inherit; }
  .tabs button.active { color:var(--accent); border-bottom:3px solid var(--accent); font-weight:700; }
  #list { padding:12px; max-width:520px; margin:0 auto; }
  .empty { text-align:center; padding:60px 20px; color:var(--ink-2); }
  .card { background:var(--card); border-radius:14px; padding:16px 18px; margin-bottom:16px; box-shadow:var(--raise); }
  .card.skeleton { color:transparent; }
  .card.skeleton * { background:var(--panel); border-radius:6px; color:transparent !important; animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .card { padding:var(--pad); border-radius:var(--card-r); }
  .card .id { font-size:11px; letter-spacing:.06em; color:var(--ink-2); font-weight:600; }
  .card .title { font-size:17px; font-weight:700; margin-top:2px; line-height:1.45; }
  .card .sub { font-size:14px; color:var(--ink-2); margin-top:2px; }
  /* The items ARE the job — what to go and fetch. They were the faintest text
     on the card at #777/13px, below the AA floor. */
  .card .items { font-size:15px; font-weight:500; color:var(--ink-3); margin-top:10px; white-space:pre-wrap; line-height:1.55; }
  .groupHead { font-size:14px; font-weight:700; color:var(--ink-2); margin:18px 4px 8px; display:flex; justify-content:space-between; }
  .clock { display:flex; align-items:center; gap:6px; font-size:15px; font-weight:600; padding:10px 12px; border-radius:10px; margin:-4px -4px 12px; line-height:1.4; box-shadow:var(--sink); }
  .clock.calm { background:transparent; color:var(--ink-2); padding-left:0; box-shadow:none; }
  .clock.warn { background:var(--warn-bg); color:var(--warn-ink); }
  .clock.hot  { background:var(--hot-bg);  color:var(--hot-ink); }
  .clock.free { background:var(--free-bg); color:var(--free-ink); }
  .rowMini { display:flex; align-items:center; gap:12px; }
  .rowMini .body { flex:1; min-width:0; }
  .rowMini .body .items { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .miniBtn { width:112px; min-height:72px; border:none; border-radius:var(--btn-r); background:var(--accent); color:var(--accent-ink); font-size:15px; font-weight:700; box-shadow:var(--raise-sm); font-family:inherit; }
  .moreBtn { position:absolute; right:10px; bottom:10px; width:36px; height:36px; border:none; background:none; color:var(--ink-2); font-size:20px; }
  .moreMenu { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; display:none; }
  .moreMenu.open { display:block; }
  .moreMenu button, .moreMenu a { display:block; width:100%; text-align:left; padding:12px 4px; border:none; background:none; font-size:15px; color:var(--ink); font-family:inherit; text-decoration:none; }
  /* Unconfirmed = a SHAPE (left edge), never colour alone. */
  .card.pending { border-left:3px solid var(--ink-2); }
  .card.failed  { border-left:3px solid var(--danger); }
  #offlineBar { position:sticky; top:calc(var(--head-h) + var(--tabs-h)); z-index:4; display:none;
    background:var(--warn-bg); color:var(--warn-ink); font-size:14px; font-weight:600;
    padding:12px 16px; align-items:center; justify-content:space-between; gap:10px; }
  #offlineBar button { border:1px solid currentColor; background:none; color:inherit; border-radius:8px; padding:7px 12px; font-size:14px; font-weight:700; font-family:inherit; }
  #learnBar { max-width:520px; margin:12px auto 0; background:var(--free-bg); color:var(--free-ink); font-size:14px; line-height:1.5; padding:12px 14px; border-radius:10px; display:none; justify-content:space-between; gap:10px; }
  #learnBar button { border:none; background:none; color:inherit; font-weight:700; font-size:14px; font-family:inherit; }
  .progress { margin-top:14px; }
  .progress .track { height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
  .progress .fill { height:100%; background:var(--ok); border-radius:3px; transition:width .3s; }
  .progress .label { display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:var(--ink-2); }
  .progress .label b { color:var(--ink); font-weight:700; }
  /* 56px, not 46px: one wet hand, gloves, in a hurry, and pressing the wrong
     one costs real money. */
  .actionBtn { margin-top:16px; width:100%; min-height:var(--btn-h); border:none; border-radius:var(--btn-r); font-weight:700; font-size:17px; font-family:inherit; background:var(--ink); color:var(--card); }
  .actionBtn { background:var(--accent); color:var(--accent-ink); box-shadow:var(--raise-sm); }
  .actionBtn.green { background:var(--accent); color:var(--accent-ink); }
  .actionBtn:active { transform:none; box-shadow:var(--sink); }
  /* Never fade a working button: in a dark room a faded button reads as "it
     didn't register" and the runner presses again. Go darker instead. */
  .actionBtn.busy { background:var(--panel); color:var(--ink); box-shadow:var(--sink); }
  .actionBtn.ok { background:var(--ok); color:#06210F; }
  .actionBtn.fail { background:var(--danger); color:#2A0A0A; }
  .actionBtn[disabled]:not(.busy):not(.ok):not(.fail) { background:var(--line); color:var(--ink-2); }
  .miniform { margin-top:12px; border-top:1px solid var(--line); padding-top:12px; display:none; }
  .miniform.open { display:block; }
  /* No uppercase (does nothing in Thai) and no letter-spacing (it pushes the
     vowels and tone marks away from the consonant they belong to). */
  .miniform label { display:block; font-size:15px; color:var(--ink-2); font-weight:600; margin-top:12px; }
  .miniform input, .miniform select { width:100%; min-height:44px; padding:8px 10px; margin-top:4px; border:none; border-radius:10px; font-size:16px; background:var(--bg); color:var(--ink); box-shadow:var(--sink); font-family:inherit; }
  .miniform input:focus, .miniform select:focus { outline:none; box-shadow:var(--sink), 0 0 0 2px rgba(47,163,154,.6); }
  .miniform .err { color:var(--danger); font-size:15px; font-weight:600; margin-top:10px; min-height:18px; line-height:1.5; }
  #boot { text-align:center; padding:80px 20px; color:var(--ink-2); }
  #lastUpdated { text-align:center; font-size:12px; color:var(--ink-2); padding:10px; }
  #toast { position:fixed; left:16px; right:16px; top:calc(var(--head-h) + var(--tabs-h) + 8px); background:var(--panel); color:var(--ink); border:none; box-shadow:var(--raise); padding:12px 16px; border-radius:10px; font-size:14px; text-align:center; transform:translateY(120%); transition:transform .25s; z-index:20; }
  /* Hidden must mean HIDDEN. translateY(-140%) is 140% of the toast's own
     height — about 50px — which parked it right on top of the tab bar instead
     of off-screen. Opacity + visibility cannot be off by a few pixels. */
  #toast { opacity:0; visibility:hidden; transform:translateY(-12px); transition:opacity .2s, transform .2s, visibility .2s; }
  #toast.show { opacity:1; visibility:visible; transform:translateY(0); }
  #toast.err { background:var(--danger); }
  #scopeBanner { max-width:520px; margin:12px auto 0; padding:10px 14px; background:var(--warn-bg); color:var(--warn-ink); border-radius:10px; font-size:13px; font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  #scopeBanner a { color:var(--warn-ink); font-weight:800; white-space:nowrap; }
  /* "ทั้งหมด"/"สรุปเดือนนี้" mix every shop together — this is the one control
     that lets a runner or a manager pull one shop back out of that mix. Hidden
     entirely when only one shop is in play, so it never costs a single-shop
     shift any screen space. */
  #shopFilterBar { display:none; max-width:520px; margin:10px auto 0; }
  .shopChipRow { display:flex; gap:8px; overflow-x:auto; padding:0 12px 2px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .shopChipRow::-webkit-scrollbar { display:none; }
  .shopChip { flex:0 0 auto; border:none; box-shadow:var(--raise-sm); background:var(--card); color:var(--ink-2); font-family:inherit; font-size:14px; font-weight:600; padding:8px 14px; border-radius:999px; white-space:nowrap; }
  /* Multi-select needs a much louder "on": with several chips selected at once,
     a one-shade difference makes the set of picks unreadable at a glance. */
  .shopChip.active { background:var(--card); color:var(--accent); font-weight:800; box-shadow:var(--sink), 0 0 0 2px rgba(47,163,154,.55); }
  .shopChipRow.zoneRow { margin-bottom:8px; }
  .zoneChip { text-transform:none; letter-spacing:0; }
  .zoneChip.active { box-shadow:none; }
  .liveDot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:6px; vertical-align:middle; animation:livePulse 2s ease-in-out infinite; }
  @keyframes livePulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  .unknownBox { max-width:520px; margin:10px auto 0; padding:14px 16px; background:var(--warn-bg); color:var(--warn-ink); border-radius:12px; font-size:14px; line-height:1.7; box-shadow:var(--raise-sm); }
  .unknownBox code { display:block; margin:8px 0; padding:10px; background:var(--bg); color:var(--ink); border-radius:8px; font-size:13px; word-break:break-all; box-shadow:var(--sink); }
  .unknownBox button { width:100%; min-height:44px; border:none; border-radius:8px; background:var(--accent); color:var(--accent-ink); font-family:inherit; font-size:14px; font-weight:700; }
  /* Sales filter + stat strip (สรุปเดือนนี้ tab, managers only). The stat
     grid is 2x2 rather than a 4-across row: four numbers side by side on a
     360px phone shrink to a size nobody reads at arm's length in a dark shop. */
  .rangeChipRow { display:flex; gap:8px; overflow-x:auto; padding:0 0 2px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .rangeChipRow::-webkit-scrollbar { display:none; }
  .rangeChip { flex:0 0 auto; border:none; box-shadow:var(--raise-sm); background:var(--card); color:var(--ink-2); font-family:inherit; font-size:14px; font-weight:600; padding:8px 14px; border-radius:999px; white-space:nowrap; }
  .rangeChip.active { background:var(--card); color:var(--accent); box-shadow:var(--sink), 0 0 0 2px rgba(47,163,154,.55); }
  .customRangeRow { display:none; gap:8px; margin-top:10px; }
  .customRangeRow.open { display:flex; }
  .customRangeRow input { flex:1; min-width:0; min-height:44px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:16px; font-family:inherit; background:var(--card); color:var(--ink); }
  .statGrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .statBox { background:var(--bg); border-radius:10px; padding:12px 14px; box-shadow:var(--sink); }
  .statBox .k { font-size:12px; color:var(--ink-2); font-weight:600; }
  .statBox .v { font-size:20px; font-weight:800; margin-top:4px; line-height:1.2; }
  .statBox .v small { font-size:13px; font-weight:600; color:var(--ink-2); }
  .statBox.wide { grid-column:1 / -1; }
  .appealRow { padding:12px 0; border-bottom:1px solid var(--line); }
  .appealRow:last-child { border-bottom:none; }
  .appealTop { display:flex; justify-content:space-between; gap:10px; font-size:14px; font-weight:600; }
  .appealMeta { font-size:12px; color:var(--ink-2); margin-top:3px; line-height:1.6; }
  .appealActions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .appealBtn { flex:1 1 30%; min-height:40px; border-radius:8px; border:none; box-shadow:var(--raise-sm); background:var(--card); color:var(--ink); font-family:inherit; font-size:13px; font-weight:700; }
  .appealBtn.warn { color:var(--danger); }
  .appealBtn[disabled] { opacity:.5; }
  .reassignRow { display:none; gap:8px; margin-top:8px; }
  .reassignRow.open { display:flex; }
  #uploadStrip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; background: var(--panel); box-shadow: var(--raise-sm); font-size: 13px; }
  #uploadStrip .upl { color: var(--ink); } #uploadStrip .upl.bad { color: var(--bad); }
  #uploadStrip .dim { color: var(--ink-2); }
  #uploadStrip button { margin-left: 6px; padding: 4px 10px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink, #08201E); font-weight: 700; font-size: 12px; }
  .reassignRow select, .reassignRow input { flex:1; min-width:0; min-height:40px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:16px; font-family:inherit; background:var(--card); color:var(--ink); }
  .zoneRow { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .zoneRow:last-child { border-bottom:none; }
  /* Per-shop takings. A bar against the best-selling shop is read in a glance;
     a column of baht figures has to be compared number by number. */
  .shopRow { display:block; width:100%; text-align:left; background:none; border:none; font-family:inherit; color:inherit;
             padding:9px 0 7px; border-bottom:1px solid var(--line); }
  .shopRow:last-child { border-bottom:none; }
  .shopRow.picked { background:var(--bg); border-radius:8px; padding-left:8px; padding-right:8px; }
  .shopRowTop { display:flex; justify-content:space-between; gap:10px; font-size:14px; align-items:baseline; }
  .shopRowTop b { white-space:nowrap; }
  .shopBarTrack { height:6px; border-radius:999px; background:var(--line); margin-top:6px; overflow:hidden; }
  .shopBarFill { height:100%; border-radius:999px; background:var(--accent); }
  /* Bottom sheet for the cancel reason — thumb-reachable, big targets, and
     it dims the board behind it so there is one decision on screen. */
  .sheetWrap { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .sheet { width:100%; max-width:520px; background:var(--card); border-radius:18px 18px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -10px 30px var(--lo); }
  .sheetTitle { font-size:18px; font-weight:800; }
  .sheetHint { font-size:13px; color:var(--ink-2); margin:4px 0 12px; }
  .sheetBtn { display:block; width:100%; min-height:52px; margin-top:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; font-family:inherit; font-size:16px; font-weight:700; }
  .sheetBtn.cancel { color:var(--ink-2); font-weight:600; border-style:dashed; }
  .sheetBtn[disabled] { opacity:.5; }
  .promise { margin-top:8px; padding:7px 10px; border-radius:8px; font-size:13px; font-weight:700; }
  .promise.ok { background:#1E3A2C; color:var(--ok); }
  .promise.soon { background:var(--warn-bg); color:var(--warn-ink); }
  .promise.late { background:#3D2222; color:var(--danger); }
  .mgrPeriodRow { display:flex; gap:8px; margin-top:10px; }
  .mgrMonthInput { margin-top:10px; width:100%; min-height:44px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:16px; font-family:inherit; background:var(--card); color:var(--ink); }
</style>
</head>
<body>

<div id="boot">
  <div style="font-size:32px">🛎️</div>
  <div style="margin-top:8px">Connecting to LINE...</div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="headRow">
      <img id="avatar" alt="" />
      <div>
        <h1>🛎️ Davis Order <span id="buildTag" style="font-size:11px;font-weight:400;opacity:.6"></span></h1>
        <div class="who" id="whoLine"></div>
      </div>
    </div>
  </header>
  <div class="tabs">
    <button id="tabAll" class="active">Orders</button>
    <button id="tabSummary">สรุปเดือนนี้</button>
    <!-- Hidden until whoAmI resolves a manager/venue_manager role — 'staff'
         never sees this tab exist, same boundary the backend enforces. -->
    <button id="tabManager" style="display:none">ผู้บริหาร</button>
    <button id="bellBtn" onclick="toggleBell()" title="Sound on new order / food ready" style="margin-left:auto;flex:0 0 auto;min-width:44px">🔔</button>
  </div>
  <div id="offlineBar"><span id="offlineText"></span><button onclick="forceRefresh()">Try again</button></div>
  <div id="scopeBanner" style="display:none"></div>
  <div id="learnBar"><span id="learnText"></span><button onclick="hideLearnBar()">Hide</button></div>
  <div id="uploadStrip" hidden></div>
  <div id="quotaBox" class="unknownBox" style="display:none"></div>
  <div id="unknownBox" class="unknownBox" style="display:none"></div>
  <div id="shopFilterBar"></div>
  <div id="list"></div>
  <p id="lastUpdated"></p>
</div>

<div id="toast"></div>

<!-- Config + helpers, above the SDK tag so they exist before anything uses
     them. This used to also fire the board request here, ahead of the SDK
     download, which is only possible for an unauthenticated call — and that
     is exactly what made the board (guest room numbers included) readable by
     anyone with the URL. The data fetch now happens after liff.init(). -->
<script>
  // ---- fill these two in before publishing ----
  // Bump on every upload. Shown in the header, so "is the phone running the
  // new build?" is answered by looking at the screen instead of guessing.
  var BUILD = 'v36';
  // 2026-09-14: moved to a LINE Login channel under the SAME provider as the

  function copyMyUserId() {
    var text = me && me.userId ? me.userId : '';
    if (!text) return;
    // The LINE webview blocks the async clipboard API often enough that a
    // silent failure is the norm; the textarea fallback is what actually works.
    var done = function () { toast('ID copied'); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
        return;
      }
    } catch (e) { /* fall through */ }
    legacyCopy(text, done);
  }
  function legacyCopy(text, done) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    } catch (e) {
      toast('Could not copy — press and hold the ID to copy it yourself', true);
    }
  }

  function toast(msg, isErr) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = isErr ? 'err show' : 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }

  // ---- Photo picker: shrink to a reasonable size before base64-encoding, same reasoning as photo-input.html on the Apps Script side ----
  function shrinkPhoto(file, done) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        done(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function () { done(reader.result); };
      img.src = reader.result;
    };
    reader.onerror = function () { done(null); };
    reader.readAsDataURL(file);
  }

  function actionSectionHtml(row, mini) {
    if (row.stage === 2) return '';
    if (mini) {
      // A compact row: whoever is working it already knows what it is.
      var label = (row.stage === 0 && row.is24 && !row.billAt) ? 'Bill received'
        : (row.stage === 0 && row.is24) ? 'Food ready'
        : (row.stage === 0) ? 'Delivered'
        : 'Deliver';
      // Every step opens a form now: the bare 24BLVD close was what let an
      // order finish with no bill and no amount, and the backend refuses it.
      if (label === 'Bill received') {
        return '<button class="miniBtn" id="bill-' + row.orderId + '" onclick="doBillReceived(\'' + row.orderId + '\')">' + label + '</button>';
      }
      return '<button class="miniBtn" id="btn-' + row.orderId + '" onclick="toggleForm(\'' + row.orderId + '\')">' + label + '</button>';
    }
    if (row.stage === 0 && row.is24 && !row.billAt) {
      // Phase 20: one tap, nothing to type — and the backend refuses "food
      // ready" until it has happened, so the second button waits behind it.
      return '<button class="actionBtn" id="bill-' + row.orderId + '" onclick="doBillReceived(\'' + row.orderId + '\')" ' +

  /**
   * BUG FIXED: the compact "in progress" row rendered only the button, never
   * this form — so pressing รับอาหาร marked the form open, re-rendered the same
   * button, and nothing appeared. Worse, openForms was now non-empty, which
   * stops the poll (refresh() bails while a form is open), so the whole board
   * froze as well. The form markup now lives in one place and both layouts use it.
   */
  /**
   * `kind` is 'kitchen' or 'handover' — the two steps stopped being the same
   * form in Phase 5. The kitchen has no bill and does not know what the guest
   * paid, so its form is one photo and nothing to type; the handover takes
   * the money, the bill and a photo of the food as it was left.

  function formBodyHtml(orderId, submitFnName, kind) {
    var open = !!openForms[orderId];
    var body = '';

    } else {

        '<label>Payment</label><select id="pay-' + orderId + '"><option value="Room Charge">Room Charge</option><option value="Cash">Cash</option><option value="Card">Card</option><option value="QR Code">QR Code</option></select>' +
        // No `capture` attribute: it forces the camera on many phones, so a bill that
        // was already photographed (or already handed back) could not be attached at
        // all.
        '<label>📸 Photo of the food as delivered</label><input type="file" accept="image/*" id="food-' + orderId + '" />' +
        '<label>🧾 Photo of the bill (more than one is fine)</label><input type="file" accept="image/*" multiple id="photo-' + orderId + '" />';

  /** Opening one card's form closes any other open one — one decision on screen at a time, not a wall of forms. */
  function toggleForm(orderId) {
    var wasOpen = !!openForms[orderId];
    openForms = {};
    // BUG FIXED (v28): closing wrote `openForms[id] = false`, and the poll's
    // "is a form open" test counted keys, not values — so tapping a form
    // closed froze the board until the next save or a reload. A closed form
    // is now simply absent.
    if (!wasOpen) openForms[orderId] = true;
    render();
    // A board that arrived while the form was open is applied now.
    if (!hasOpenForm() && pendingRealtime) applyRealtimeRows(pendingRealtime, '');

  function hasOpenForm() {
    return Object.keys(openForms).some(function (k) { return !!openForms[k]; });

  /**
   * E2 — every shop, not just the five the LINE card has room for, with a bar
   * against the top seller. Tapping a shop toggles it in the SAME shopFilters
   * set the chip bar uses; a second filtering mechanism here would be one more
   * thing that can disagree with the list underneath it.

  function shopBreakdownHtml() {
    if (!sales || !sales.byShop || !sales.byShop.length) return '';
    // No filtering here any more: the backend totalled exactly these shops
    // (loadSales sends them), so byShop already IS the filtered set. Filtering
    // it again would be a second place for the two answers to disagree.
    var shown = sales.byShop;
    if (!shown.length) return '';
    var peak = shown[0].amount || 0;
    var total = shown.reduce(function (a, sh) { return a + sh.amount; }, 0);
    var picked = shopFilters.length;
    return '<div style="margin-top:16px"><div class="k" style="font-size:12px;color:var(--ink-2);font-weight:600">' +
      'แยกตามร้าน <span style="font-weight:500">· กดเพื่อเลือก เลือกได้หลายร้าน' +
      (picked ? ' · เลือกอยู่ ' + picked + ' ร้าน' : '') + '</span></div>' +
      shown.map(function (sh) {
        var pct = total > 0 ? Math.round((sh.amount / total) * 100) : 0;
        var width = peak > 0 ? Math.max(2, Math.round((sh.amount / peak) * 100)) : 0;
        return '<button class="shopRow' + (shopSelected(sh.shop) ? ' picked' : '') + '" data-shop-row="' + escAttr(sh.shop) + '">' +
          '<span class="shopRowTop"><span>' + (shopSelected(sh.shop) ? '✓ ' : '') + esc(sh.shop) +

            '<b>' + baht(sh.amount) + '</b></span>' +

   * than by a timer of its own — "real-time" here means the same tick the
   * board already runs on, not a second stream of requests.
   */
  function salesPanelHtml() {
    var chips = '<div class="rangeChipRow">' + RANGE_CHIPS.map(function (c) {
      return '<button class="rangeChip' + (salesRange === c.key ? ' active' : '') + '" data-range="' + c.key + '">' + c.label + '</button>';
    }).join('') + '</div>' +
      '<div class="customRangeRow' + (salesRange === 'custom' ? ' open' : '') + '">' +

      '<input type="date" id="salesTo" value="' + escAttr(salesTo) + '" />' +
      '</div>';

    var ot = (sales && sales.onTime) || { hotel: {}, sell: {} };
    var stats;
    if (!sales) {
      stats = '<div class="statGrid"><div class="statBox wide"><div class="k">ยอดขาย</div><div class="v">' +
        (salesLoading ? 'กำลังโหลด...' : '—') + '</div></div></div>';
    } else {
      stats = '<div class="statGrid">' +
        '<div class="statBox wide"><div class="k">ยอดขายรวม</div><div class="v">' + baht(sales.totalSales) + ' <small>บาท</small></div></div>' +
        '<div class="statBox"><div class="k">จำนวนออเดอร์</div><div class="v">' + sales.orderCount + '</div></div>' +

        '<div class="statBox"><div class="k">ค้างอยู่ในรอบนี้</div><div class="v">' + sales.pendingCount + '</div></div>' +
        '<div class="statBox"><div class="k">ยกเลิก</div><div class="v">' + (sales.cancelledCount || 0) + '</div></div>' +
        // Two promises (30 นาที / 45 นาที) so two scores — a blended number
        // across different targets cannot be acted on.
        '<div class="statBox"><div class="k">ตรงเวลา โรงแรม <small>(≤' + ot.hotel.target + ')</small></div><div class="v">' +
          (ot.hotel.pct == null ? '—' : ot.hotel.pct + '%') + '</div></div>' +
        '<div class="statBox"><div class="k">ตรงเวลา ร้าน→ร้าน <small>(≤' + ot.sell.target + ')</small></div><div class="v">' +
          (ot.sell.pct == null ? '—' : ot.sell.pct + '%') + '</div></div>' +

            '🧹 ค้างข้ามรอบ ' + sales.staleCount + ' ออเดอร์ — ต้องไปเคลียร์</div>'
          : '') +
        // Phase 8 §7/§8.1 — two zone breakdowns, and the labels have to say
        // which is which. bySellerZone groups by the shop that FILLED the
        // order (24BLVD vs Fairway), which is what the owner asked to see.
        // byZone groups by who PLACED it and reads "โรงแรม" nearly all the way
        // down, because that is what a hotel ordering from its own shops looks
        // like. Both answer real questions; either one labelled just "โซน" is
        // how one gets read as the other.
        (sales.bySellerZone && sales.bySellerZone.length
          ? '<div style="margin-top:16px"><div class="k" style="font-size:12px;color:var(--ink-2);font-weight:600">ขายโดยโซน</div>' +

            }).join('') +

            '<div class="zoneRow" style="border-top:1px solid var(--line);font-weight:700"><span>รวมทุกโซน <span style="color:var(--ink-2)">(' +
              sales.bySellerZone.reduce(function (a, z) { return a + z.count; }, 0) + ' ใบ · ค้าง ' +
              sales.bySellerZone.reduce(function (a, z) { return a + (z.open || 0); }, 0) + ')</span></span><b>' +
              baht(sales.bySellerZone.reduce(function (a, z) { return a + z.amount; }, 0)) + '</b></div>' +
            '</div>'
          : '') +
        (sales.byZone && sales.byZone.length
          ? '<div style="margin-top:16px"><div class="k" style="font-size:12px;color:var(--ink-2);font-weight:600">สั่งโดย</div>' +
            sales.byZone.map(function (z) {
              return '<div class="zoneRow"><span>' + esc(z.zone) + ' <span style="color:var(--ink-2)">(' + z.count + ')</span></span><b>' + baht(z.amount) + '</b></div>';
            }).join('') + '</div>'
          : '') +
        shopBreakdownHtml();
    }

    // Say which trading round these numbers cover. Shops run 10:00–02:00, so
    // "today" is not the calendar day and showing the range removes the
    // guesswork about whether last night's small hours are in or out.
    var roundNote = sales && sales.range
      ? '<div style="font-size:12px;color:var(--ink-2);margin-top:2px">รอบขาย ' + esc(sales.range.from) +
        (sales.range.from === sales.range.to ? '' : ' – ' + esc(sales.range.to)) + ' (10:00 – 02:00)</div>'
      : '';
    // Only the live range gets the pulsing dot: on "เดือนนี้" a live indicator
    // would be true and meaningless.
    var liveNote = (salesRange === 'today' && lastSalesAt)
      ? '<div style="font-size:12px;color:var(--ink-2);margin-top:2px"><span class="liveDot"></span>อัปเดตล่าสุด ' + esc(lastSalesAt) + ' · รีเฟรชเองทุก 10 วินาที</div>'
      : '';
    var scopeNote = (shopFilters.length || zoneFilter)
      ? '<div style="font-size:12px;color:var(--ink-2);margin-top:2px">กำลังดู: <b>' + esc(shopFilterLabel() || zoneFilter) + '</b></div>'
      : '';
    return '<div class="card" id="salesPanel"><div class="id">📊 ยอดขาย' +
      (sales && sales.isScoped ? ' · เฉพาะร้านของคุณ' : '') + '</div>' +
      roundNote + liveNote + scopeNote + chips + stats + '</div>';
  }

  function renderSummary() {
    var list = document.getElementById('list');
    if (authState === 'none') { hideShopFilterBar(); list.innerHTML = noAuthHtml(); return; }
    var salesHtml = isSalesViewer() ? salesPanelHtml() : '';
    if (!summary) { hideShopFilterBar(); list.innerHTML = salesHtml + skeletonCards(); return; }
    // Zones for these rows come from the sales panel's byShop, which carries the
    // zone the backend stamped on it — one definition, not a copy kept here.
    // Chips come from the directory, not from the rows that survived the last
    // filter — a chip list that shrinks as you filter takes away the control
    // that clears it.
    renderShopFilterBar(allKnownShops().length ? allKnownShops() : distinctShops(summary.rows), zoneOfShop);
    var rows = summary.rows.filter(function (r) { return shopMatches(r.seller) && zoneOfShop(r.seller) === (zoneFilter || zoneOfShop(r.seller)); });
    if (rows.length === 0) {
      list.innerHTML = salesHtml + ((shopFilters.length || zoneFilter)
        ? '<div class="empty">ยังไม่มีออเดอร์ที่ส่งมอบแล้วของ "' + esc(shopFilterLabel() || zoneFilter) + '" ในเดือนนี้</div>'
        : '<div class="empty">ยังไม่มีออเดอร์ที่ส่งมอบแล้วในเดือนนี้</div>');
      return;
    }
    // The server's grandTotal is authoritative for the unfiltered view; once
    // anything is picked the total has to be recomputed from just those rows.
    var filtered = shopFilters.length || zoneFilter;
    var total = filtered ? rows.reduce(function (sum, r) { return sum + Number(r.amount || 0); }, 0) : summary.grandTotal;
    var scopeText = shopFilterLabel() || zoneFilter;
    list.innerHTML = salesHtml + '<div class="card"><div class="id">สรุปเดือน ' + esc(summary.monthKey) + (scopeText ? ' · ' + esc(scopeText) : '') + '</div>' +
      rows.map(function (r) {
        return '<div class="sumRow"><span>' + esc(r.seller) + ' → ' + esc(r.buyer) + ' <span style="color:var(--ink-2)">(' + r.count + ' ออเดอร์)</span></span>' +
          '<b>' + Number(r.amount).toLocaleString('en-US') + '</b></div>';
      }).join('') +
      '<div class="sumTotal"><span>' + (filtered ? 'รวมเฉพาะที่เลือก (' + esc(scopeText) + ')' : 'รวมทั้งหมด') + '</span><span>' + Number(total).toLocaleString('en-US') + ' บาท</span></div>' +
      // Payroll export names guests, rooms, and individual payments — same bar
      // as the SLA digest, so it's gated by role here too, not just server-side.
      (me && me.role === 'manager'
        ? '<button class="actionBtn" style="margin-top:14px;width:100%" id="btnExportPayroll" onclick="downloadPayrollCsv()">📥 ดาวน์โหลดไฟล์บัญชี (เดือนที่แล้ว)</button>'
        : '') +

  /** Accounting's monthly pay-cycle file: order detail + cross-store totals for the month that just closed. Manager role only (enforced server-side too). */
  /**
   * A client-side Blob + <a download> never reliably reaches an actual file
   * on the phone from inside LINE's in-app browser (iOS especially — the
   * webview has nowhere real to save it, so "the download" just vanishes).
   * The backend now saves the CSV to Drive instead and hands back a share
   * link; opening that in the SYSTEM browser (external:true, not LINE's own
   * webview) is what actually lets iOS/Android download or hand it to Sheets.
   */
  /** Opens the PDF — a finished document accounting can read/print immediately — the CSV lands in the same Drive folder either way, for whoever needs to import the numbers instead. */
  function openExportedCsv(r) {
    if (!r.ok && r.error) { toast(r.error, true); return; }
    var url = r.drivePdfUrl || r.driveUrl;
    if (!url) { toast('ได้ไฟล์แต่ไม่มีลิงก์เปิด — แจ้งผู้ดูแลระบบ', true); return; }
    liff.openWindow({ url: url, external: true });
  }

  function downloadPayrollCsv() {
    withButtonBusy('btnExportPayroll', 'กำลังสร้างไฟล์...', function () {
      return callApi('exportMonthlyPayrollCsvViaLiff', creds()).then(openExportedCsv);
    });
  }

  /** Zone-only companion to downloadPayrollCsv — just the 24BLVD/Fairway payment lines, for whatever month is picked in the ผู้บริหาร tab's month field (not always the previous month like the full export). */
  function downloadZonePaymentCsv() {
    withButtonBusy('btnExportZone', 'กำลังสร้างไฟล์...', function () {
      var payload = creds();
      payload.monthKey = managerMonthKey;
      return callApi('exportZonePaymentCsvViaLiff', payload).then(openExportedCsv);
    });
  }

  /**
   * ผู้บริหาร tab: two independent cards (SLA leaderboard, monthly
   * reconciliation) that each load and fail on their own — a slow/broken
   * reconciliation query must not blank out a working leaderboard, and vice
   * versa. Neither ever runs for a plain 'staff' caller: the tab that opens
   * this view is itself hidden until whoAmIViaLiff says otherwise, and the
   * backend re-checks role independently (requireManagerActor_).
   */
  function renderManager() {
    hideShopFilterBar();
    var list = document.getElementById('list');
    if (authState === 'none') { list.innerHTML = noAuthHtml(); return; }

    var html = appealsCardHtml();

    html += '<div class="card"><div class="id">🏆 อันดับค่าปรับ SLA</div>' +
      '<div class="mgrPeriodRow">' +
      [7, 30, 90].map(function (d) {
        return '<button class="shopChip' + (managerDays === d ? ' active' : '') + '" onclick="setManagerDays(' + d + ')">' + d + ' วัน</button>';
      }).join('') +
      '</div>';
    if (!managerLeaderboard) {
      html += '<div style="font-size:13px;color:var(--ink-2);margin-top:10px">กำลังโหลด...</div>';
    } else if (managerLeaderboard.error) {
      html += '<div class="empty" style="padding:16px 0">' + esc(managerLeaderboard.error) + '</div>';
    } else if (!managerLeaderboard.rows.length) {
      html += '<div class="empty" style="padding:16px 0">ไม่มีรายการโดนปรับใน ' + managerDays + ' วันที่ผ่านมา 🎉</div>';
    } else {
      if (managerLeaderboard.isScoped) html += '<div style="font-size:12px;color:var(--ink-2);margin-top:10px">แสดงเฉพาะร้านของคุณ</div>';
      html += managerLeaderboard.rows.map(function (r, i) {
        // Two figures on purpose: what is settled and collectable, and what is
        // still inside its appeal window. One blended number is what made the
        // appeal channel look decorative.
        var pending = r.pendingAmount
          ? ' <span style="color:var(--ink-2);font-weight:400">+' + Number(r.pendingAmount).toLocaleString('en-US') + ' รออุทธรณ์</span>'
          : '';
        return '<div class="sumRow"><span>' + (i + 1) + '. ' + esc(r.name || '(ไม่ทราบชื่อ)') +
          ' <span style="color:var(--ink-2)">(' + r.count + ' ครั้ง)</span></span><b>' +
          Number(r.amount).toLocaleString('en-US') + pending + '</b></div>';
      }).join('');
    }
    html += '</div>';

    html += '<div class="card"><div class="id">📅 สรุปรายเดือน</div>' +
      '<input type="month" class="mgrMonthInput" value="' + esc(managerMonthKey) + '" onchange="setManagerMonth(this.value)" />';
    if (!managerRecon) {
      html += '<div style="font-size:13px;color:var(--ink-2);margin-top:10px">กำลังโหลด...</div>';
    } else if (managerRecon.error) {
      html += '<div class="empty" style="padding:16px 0">' + esc(managerRecon.error) + '</div>';
    } else if (!managerRecon.rows.length) {
      html += '<div class="empty" style="padding:16px 0">ไม่มีออเดอร์ที่ส่งมอบแล้วในเดือนนี้</div>';
    } else {
      if (managerRecon.isScoped) html += '<div style="font-size:12px;color:var(--ink-2);margin-top:10px">แสดงเฉพาะร้านของคุณ</div>';
      html += managerRecon.rows.map(function (r) {
        return '<div class="sumRow"><span>' + esc(r.seller) + ' → ' + esc(r.buyer) +
          ' <span style="color:var(--ink-2)">(' + r.count + ' ออเดอร์)</span></span><b>' + Number(r.amount).toLocaleString('en-US') + '</b></div>';
      }).join('') +
        '<div class="sumTotal"><span>รวมทั้งหมด</span><span>' + Number(managerRecon.grandTotal).toLocaleString('en-US') + ' บาท</span></div>';
    }
    html += '</div>';

    // Zone rollup: AMORE/LULU/BESOBESO/NOT IN BANGKOK collapse into one
    // 24BLVD line, MANDRAKE CAFE into Fairway — the number actually paid,
    // not per-shop. null (not just empty) for a venue_manager, since their
    // scoped view is one shop, not a zone.
    if (managerRecon && managerRecon.zoneRows) {
      html += '<div class="card"><div class="id">💰 ยอดจ่ายจริงตามโซน</div>';
      if (!managerRecon.zoneRows.length) {
        html += '<div class="empty" style="padding:16px 0">ไม่มียอดข้ามโซนเดือนนี้</div>';
      } else {
        html += managerRecon.zoneRows.map(function (r) {
          return '<div class="sumRow"><span>' + esc(r.sellerZone) + ' → ' + esc(r.buyerZone) +
            ' <span style="color:var(--ink-2)">(' + r.count + ' ออเดอร์)</span></span><b>' + Number(r.amount).toLocaleString('en-US') + '</b></div>';
        }).join('');
      }
      html += '<button class="actionBtn" style="margin-top:14px;width:100%" id="btnExportZone" onclick="downloadZonePaymentCsv()">📥 ดาวน์โหลดไฟล์จ่ายเงินตามโซน</button>';
      html += '</div>';
    }

    list.innerHTML = html;
  }

  function isFullManager() { return !!me && (me.isManager || me.role === 'manager'); }

  /**
   * Fines waiting on a decision. Filed appeals come first and carry the three
   * buttons; the rows nobody has answered yet are listed underneath as a
   * count, not as work — they close themselves at their due date.
   */
  function appealsCardHtml() {
    if (!isFullManager()) return '';
    var html = '<div class="card"><div class="id">🙋 อุทธรณ์ค่าปรับ</div>';
    if (!appeals) return html + '<div style="font-size:13px;color:var(--ink-2);margin-top:10px">กำลังโหลด...</div></div>';
    if (appeals.error) return html + '<div class="empty" style="padding:16px 0">' + esc(appeals.error) + '</div></div>';

    if (!appeals.filed.length) {
      html += '<div class="empty" style="padding:16px 0">ไม่มีเรื่องรออุทธรณ์ 🎉</div>';
    } else {
      html += appeals.filed.map(function (a) {
        var key = a.orderId + '|' + a.leg;
        var busy = appealBusy === key;
        var d = ' data-appeal="' + escAttr(key) + '"';
        return '<div class="appealRow">' +
          '<div class="appealTop"><span>' + esc(a.orderId) + ' · ' + esc(a.leg) + '</span><b>' + Number(a.amount || a.deduction).toLocaleString('en-US') + ' บาท</b></div>' +
          '<div class="appealMeta">ผู้ถูกหัก: ' + esc(a.charged || '-') + ' · ล่าช้า ' + a.delayMinutes + ' นาที (' + esc(a.band) + ')<br>ครบกำหนด ' + esc(a.dueDate) + '</div>' +
          '<div class="appealActions">' +
            '<button class="appealBtn warn"' + d + ' data-act="cancel"' + (busy ? ' disabled' : '') + '>ยกเลิกค่าปรับ</button>' +
            '<button class="appealBtn"' + d + ' data-act="reassign-open"' + (busy ? ' disabled' : '') + '>เปลี่ยนผู้ถูกหัก</button>' +
            '<button class="appealBtn"' + d + ' data-act="uphold"' + (busy ? ' disabled' : '') + '>ยืนยันตามเดิม</button>' +
          '</div>' +
          '<div class="reassignRow" id="reassign-' + escAttr(key) + '">' +
            '<select data-reassign-pick="' + escAttr(key) + '">' +
              '<option value="">— เลือกคน —</option>' +
              (a.candidates || []).map(function (c) { return '<option value="' + escAttr(c.lineId || '') + '" data-name="' + escAttr(c.name) + '">' + esc(c.name) + '</option>'; }).join('') +
              '<option value="__other">คนอื่น (พิมพ์ชื่อ)…</option>' +
            '</select>' +
            '<input type="text" placeholder="ชื่อคนที่ถูกหักแทน" data-reassign-name="' + escAttr(key) + '" style="display:none" />' +
            '<button class="appealBtn"' + d + ' data-act="reassign"' + (busy ? ' disabled' : '') + '>บันทึก</button>' +
          '</div>' +
          '</div>';
      }).join('');
    }
    if (appeals.pending && appeals.pending.length) {
      html += '<div class="appealMeta" style="margin-top:12px">ยังอยู่ในช่วงอุทธรณ์อีก ' + appeals.pending.length +
        ' รายการ — ถ้าไม่มีใครยื่น ระบบจะปิดเองเมื่อครบกำหนด</div>';
    }
    return html + '</div>';
  }

  function loadAppeals() {
    if (!isFullManager()) return;
    callApi('slaAppealsViaLiff', creds()).then(function (r) {
      appeals = (r && r.error) ? r : (r || { error: 'โหลดไม่สำเร็จ' });
    }).catch(function () {
      appeals = { error: 'โหลดไม่สำเร็จ ลองใหม่อีกครั้ง' };
    }).then(function () {
      if (currentTab === 'manager') renderManager();
    });
  }

  document.getElementById('list').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-appeal]');
    if (!btn) return;
    var key = btn.getAttribute('data-appeal');
    var act = btn.getAttribute('data-act');
    if (act === 'reassign-open') {
      var row = document.getElementById('reassign-' + key);
      if (row) {
        row.classList.toggle('open');
        var sel = row.querySelector('select'), free = row.querySelector('input[type=text]');
        if (sel && free && !sel._wired) { sel._wired = true; sel.addEventListener('change', function () { free.style.display = sel.value === '__other' ? '' : 'none'; if (sel.value === '__other') free.focus(); }); }
      }
      return;
    }
    var parts = key.split('|');
    var payload = creds();
    payload.orderId = parts[0];
    payload.leg = parts[1];
    payload.decision = act;
    if (act === 'reassign') {
      var pick = document.querySelector('[data-reassign-pick="' + key.replace(/"/g, '') + '"]');
      var input = document.querySelector('[data-reassign-name="' + key.replace(/"/g, '') + '"]');
      var name = '', lineId = '';
      if (pick && pick.value && pick.value !== '__other') { lineId = pick.value; name = pick.options[pick.selectedIndex].getAttribute('data-name') || ''; }
      else name = input ? input.value.trim() : '';
      if (!name) { toast('เลือกหรือใส่ชื่อคนที่จะถูกหักแทนก่อน', true); return; }
      payload.toName = name;
      payload.toLineId = lineId;
    }
    appealBusy = key;
    renderManager();
    callApi('decideSlaAppealViaLiff', payload).then(function (r) {
      if (!r || r.error) { toast((r && r.error) || 'บันทึกไม่สำเร็จ', true); return; }
      toast('บันทึกแล้ว');
      appeals = null;
      loadAppeals();
      managerLeaderboard = null;
      loadManagerLeaderboard();
    }).catch(function () {
      toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง', true);
    }).then(function () {
      appealBusy = '';
      if (currentTab === 'manager') renderManager();
    });
  });

  function loadManagerLeaderboard() {
    var payload = creds();
    payload.days = managerDays;
    callApi('slaLeaderboardViaLiff', payload).then(function (r) {
      managerLeaderboard = (r && r.error) ? r : (r || { error: 'โหลดไม่สำเร็จ' });
    }).catch(function () {
      managerLeaderboard = { error: 'โหลดไม่สำเร็จ ลองใหม่อีกครั้ง' };
    }).then(function () {
      if (currentTab === 'manager') renderManager();
    });
  }
  function loadManagerRecon() {
    var payload = creds();
    payload.monthKey = managerMonthKey;
    callApi('monthlyReconciliationViaLiff', payload).then(function (r) {
      managerRecon = (r && r.error) ? r : (r || { error: 'โหลดไม่สำเร็จ' });
    }).catch(function () {
      managerRecon = { error: 'โหลดไม่สำเร็จ ลองใหม่อีกครั้ง' };
    }).then(function () {
      if (currentTab === 'manager') renderManager();
    });
  }
  function setManagerDays(d) {
    managerDays = d;
    managerLeaderboard = null;
    render();
    loadManagerLeaderboard();
  }
  function setManagerMonth(monthKey) {
    if (!monthKey) return;
    managerMonthKey = monthKey;
    managerRecon = null;
    render();
    loadManagerRecon();
  }

  var GROUP_META = [
    { key: 0, title: '🍳 Ready — go and collect' },
    { key: 1, title: '⚡ กดใบนี้ก่อน' },
    { key: 2, title: '🅿 ค้างนาน — กดได้เลย ไม่หักคุณ' },
    { key: 3, title: '✅ เสร็จแล้ว — ส่งมอบ / ยกเลิก' },
    { key: 4, title: '⚪ ยังไม่ถึงเกณฑ์', collapsed: true },
  ];
  var group4Open = false;
  function cardHtml(r) {
    var title = r.isSell ? (esc(r.buyer) + ' → ' + esc(r.seller)) : esc(r.subtitle);
    var sub = r.isSell ? ('Shop to shop — ' + esc(r.seller) + ' prepares it') : esc(r.seller);
    if (r.orderedByName) sub += ' · ordered by ' + esc(r.orderedByName);
    var c = clockFor(r);
    var promise = promiseClock(r);
    var menuOpen = !!openMenus[r.orderId];
    return '<div class="card" style="position:relative" id="card-' + r.orderId + '">' +
      '<div class="clock ' + c.tier + '" id="clk-' + r.orderId + '">' + esc(c.text) + '</div>' +
      '<div class="title">' + title + '</div>' +
      '<div class="sub">' + sub + '</div>' +
      // The guest's wait, under the fine clock: the fine clock says whether
      // the person pressing is exposed, this says whether the promise is
      // still intact. They are not the same question and the runner needs both.
      (promise ? '<div class="promise ' + promise.tier + '" id="pro-' + r.orderId + '">' + esc(promise.text) + '</div>' : '') +
      (r.isCancelled ? '<div class="promise late">🚫 Cancelled</div>' : '') +
      '<div class="items">' + esc(r.items) + '</div>' +
      actionSectionHtml(r) +
      '<button class="moreBtn" onclick="toggleMenu(\'' + r.orderId + '\')" aria-label="More options">⋯</button>' +
      '<div class="moreMenu' + (menuOpen ? ' open' : '') + '" id="menu-' + r.orderId + '">' +
        '<div style="font-size:12px;color:var(--ink-2);padding:0 4px 4px">' + esc(r.orderId) + '</div>' +
        // 🔔 fires a real, billed LINE push and wakes a manager at 01:00. It used
        // to sit full-width 8px under the main button — one slip with a wet
        // thumb. Behind ⋯ it always takes two deliberate taps.
        (r.stage < 2 ? '<button id="nudge-' + r.orderId + '" onclick="doNudge(\'' + r.orderId + '\')">🔔 Nudge the shop manager</button>' : '') +
        // One line per photo, each saying what it shows. There are three kinds
        // now and two of them are the same plate — "ดูรูป (3)" would be
        // useless for the one job they exist for, telling whether a problem
        // started in the kitchen or on the way. (Phase 5 §2.4)
        ((r.photos && r.photos.length)
          ? r.photos.map(function (p) {
              return '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.label) + '</a>';
            }).join('')
          : '<div style="padding:12px 4px;color:var(--ink-2);font-size:15px">📷 No photos yet</div>') +
        '<button onclick="showRules()">📋 Fine rules</button>' +
        // Destructive, so it sits at the bottom of a menu that already takes
        // two deliberate taps to open, and asks for a reason before it does
        // anything (the backend refuses a cancellation without one).
        (r.stage < 2 && !r.isCancelled
          ? '<button style="color:var(--danger);font-weight:700" onclick="askCancel(\'' + r.orderId + '\')">🚫 Cancel order</button>'
          : '') +
      '</div>' +
      '</div>';
  }

  function miniRowHtml(r) {
    // A finished order shows what happened to it. On 2026-09-14 a runner's
    // Save timed out on hotel wifi AFTER the server had written the delivery,
    // and this row went on showing "in the kitchen 8 min" — so they retried,
    // and the manager thought the press had failed. The row now says
    // "Delivered 14:25", which is the confirmation the timeout ate.
    var done = r.stage >= STAGE_DONE;
    var c = done
      ? (r.isCancelled
          ? { tier: 'late', text: '🚫 Cancelled' }
          : { tier: 'ok', text: '✅ Delivered' + (r.deliveredAt ? ' ' + String(r.deliveredAt).slice(11, 16) : '') + (r.assignedName ? ' · ' + r.assignedName : '') })
      : clockFor(r);
    return '<div class="card" style="position:relative" id="card-' + r.orderId + '">' +
      '<div class="clock ' + c.tier + '" id="clk-' + r.orderId + '">' + esc(c.text) + '</div>' +
      '<div class="rowMini"><div class="body">' +
      '<div class="title" style="font-size:16px">' + esc(r.subtitle) + '</div>' +
      '<div class="sub">' + esc(r.seller) + '</div>' +
      '<div class="items" style="margin-top:4px">' + esc(r.items.replace(/\n/g, ', ')) + '</div>' +
      '</div>' + actionSectionHtml(r, true) + '</div>' +
      // The first stage needs a photo (24BLVD) or a bill + amount (everyone
      // else) before it can advance.
      (r.stage === 0 ? formBodyHtml(r.orderId, r.is24 ? 'submitFood' : 'submitDeliverForm', r.is24 ? 'kitchen' : 'handover') : '') +
      '</div>';
  }

  function render() {
    var list = document.getElementById('list');
    if (authState === 'none') { hideShopFilterBar(); list.innerHTML = noAuthHtml(); return; }
    if (currentTab === 'summary') { renderSummary(); return; }
    if (currentTab === 'manager') { renderManager(); return; }
    if (allRows === null) { hideShopFilterBar(); list.innerHTML = skeletonCards(); return; }
    var tabRows = allRows.filter(function (r) {
      if (currentTab === 'all') return true;
      // While whoAmI is still in flight `me` is null. The old test dropped
      // every claimed row in that window, so for the first few seconds of every
      // shift a runner holding two bags saw an empty "ต้องทำ" — which teaches
      // people not to trust the screen. Unknown identity now shows more, not less.
      if (r.stage >= STAGE_DONE) return false;
      if (!r.assignedUserId) return true;
      return !me || r.assignedUserId === me.userId;
    });

    // Chip list reflects THIS tab's shops (pre-filter), so switching back to
    // "ทุกร้าน" is always one tap away even after picking one.
    renderShopFilterBar(chipShops(tabRows), chipZoneOf(tabRows));
    var rows = tabRows.filter(function (r) { return shopMatches(r.seller) && zoneMatches(r); });

    if (rows.length === 0) {
      list.innerHTML = (shopFilters.length || zoneFilter)
        ? '<div class="empty"><div style="font-size:40px">🌙</div>' +
          '<div style="font-size:17px;font-weight:700;margin-top:16px;color:var(--ink)">Nothing open for "' + esc(shopFilterLabel() || zoneFilter) + '" right now</div></div>'
        : '<div class="empty"><div style="font-size:40px">🌙</div>' +
          '<div style="font-size:17px;font-weight:700;margin-top:16px;color:var(--ink)">Nothing open right now</div>' +
          // The real ambiguity is "no work" versus "the app is broken" — say which.
          '<div style="font-size:15px;margin-top:10px;line-height:1.6">New orders appear on their own.<br>No need to keep refreshing.</div></div>';
      return;
    }

    var buckets = { 0: [], 1: [], 2: [], 3: [], 4: [] };
    rows.forEach(function (r) { buckets[groupOf(r)].push(r); });
    Object.keys(buckets).forEach(function (k) {
      buckets[k].sort(function (a, b) { return clockFor(b).sec - clockFor(a).sec; }); // longest waiting first
    });

    var html = '';
    [0, 1, 2, 3, 4].forEach(function (g) {
      var items = buckets[g];
      if (!items.length) return;
      var meta = GROUP_META[g];
      var collapsed = g === 4 && !group4Open;
      html += '<div class="groupHead"><span>' + meta.title + ' (' + items.length + ')</span>' +
        (g === 4 ? '<button onclick="group4Open=!group4Open;render()" style="border:none;background:none;color:inherit;font-size:15px;font-family:inherit">' + (collapsed ? 'ดู ⌄' : 'ซ่อน ⌃') + '</button>' : '') +
        '</div>';
      if (collapsed) return;
      html += items.map(g === 3 ? miniRowHtml : cardHtml).join('');
    });
    list.innerHTML = html;
    layoutGroups = snapshotGroups(rows);
    pendingReorder = false;
    updateReorderBar();
  }

  /** Fingerprint of which group each row was in when the board was last laid out. */
  function snapshotGroups(rows) {
    var m = {};
    (rows || []).forEach(function (r) { m[r.orderId] = groupOf(r); });
    return m;
  }
  var layoutGroups = {};

  /**
   * Clocks advance every second, so rows would keep changing group under the
   * runner's thumb — and a list that reorders itself as someone reaches for a
   * button is how you press the wrong order and pay for it. The layout is held
   * still and a bar offers the reorder instead.
   */
  function updateReorderBar() {
    var bar = document.getElementById('learnBar');
    if (!pendingReorder) { if (bar.dataset.mode === 'reorder') { bar.style.display = 'none'; bar.dataset.mode = ''; } return; }
    bar.dataset.mode = 'reorder';
    document.getElementById('learnText').textContent = '↑ Something needs doing first — tap to reorder';
    bar.style.display = 'flex';
    bar.onclick = function () { pendingReorder = false; render(); };
  }
  function hideLearnBar() {
    var bar = document.getElementById('learnBar');
    bar.style.display = 'none';
    if (bar.dataset.mode !== 'reorder') { try { localStorage.setItem('learnHidden', '1'); } catch (e) {} }
  }

  // The VALUES are Thai because that is what gets written to the sheet and what
  // months of past cancellations are keyed on (same rule as the backend's
  // ORDER_CANCEL_REASONS_). Only the button label is English.
  var CANCEL_REASONS = ['แขกยกเลิก', 'สั่งผิด', 'ของหมด', 'อื่นๆ'];
  var CANCEL_REASON_LABELS = {
    'แขกยกเลิก': 'Guest cancelled',
    'สั่งผิด': 'Ordered by mistake',
    'ของหมด': 'Sold out',
    'อื่นๆ': 'Other',
  };

  /**
   * Two steps on purpose. A one-tap cancel on a board that repaints every ten
   * seconds is a mis-tap waiting to happen, and the reason is not optional —
   * an order that vanished with no reason recorded is unanswerable a week later.
   *
   * Rendered in the page rather than with prompt(): a native dialog inside
   * LINE's in-app webview is unreliable (silently suppressed on some iOS
   * builds), and a cancel button that appears to do nothing is worse than no
   * cancel button at all. It also gives the reasons real thumb-sized targets.
   */
  function askCancel(orderId) {

  function refresh() {

    // <input type="file">: on a busy night someone else's button press
    // repaints the board every few seconds, and the runner mid-entry is told
    // "แนบรูปบิลก่อน" for a bill they just attached. Polling resumes as soon
    // as the form closes.
    if (hasOpenForm()) return;
    if (!idToken && !accessToken) return; // not identified yet — the board requires a credential (either kind)
    // v30: once Firestore is delivering the board, no caller may poll over it
    // (v29 still showed "Updated …" from a stray poll that landed after the
    // snapshot). Presses go through forceRefresh, which is separate.
    if (realtime.live && !REQUEST_GROUP) return;

  /** Anchors the local clock to the server's, so countdowns survive a bad phone clock and a dead connection. */

    serverNowLocal = performance.now();
  }

  /**
   * "The app is dead" has to be impossible to miss. It used to be written into
   * an 11px muted line UNDER the whole list — on a busy night that is four
   * screens down, so nobody ever saw it and runners stood watching a frozen
   * board believing there was simply no new work.
   *
   * The stale data stays on screen: they still need it to go and fetch things.
   * They just have to know it is stale — and the clocks keep counting, because
   * the fines do not pause when the wifi does.

  function showOffline(message) {

    // show it at once. Sitting silently on skeleton cards (which is what the
    // page did) tells the runner nothing at all.
    if (!message && failedFetches < 2 && navigator.onLine !== false) return;
    if (allRows === null) {
      document.getElementById('list').innerHTML =
        '<div class="empty">Could not load the list<br><span style="font-size:14px">' + esc(message || 'No connection') + '</span></div>';
    }
    var bar = document.getElementById('offlineBar');
    var since = serverNowMs ? Math.floor((performance.now() - serverNowLocal) / 60000) : 0;

      ('⚠ Offline · data from ' + (since < 1 ? 'under 1' : since) + ' min ago — what you see may be out of date');

  function clearOffline() {

  }

  /**

   *    accepted the change, so the new stage is a fact — making the runner
   *    stare at the old status until a round trip completes is what made the
   *    app feel broken ("บันทึกแล้วแต่สถานะไม่เปลี่ยน ต้องเข้าออกใหม่").
   * 2. Then confirm against the server with `fresh: true`, bypassing the
   *    8-second shared cache, so the optimistic guess is replaced by truth.
   */

   *
   * ORD_20260918_01 (2026-09-18 11:57): Food ready saved in 6 s, then a
   * Firestore snapshot published BEFORE the save (11:56:40) repainted the row
   * at stage 0, the button came back, and the same person pressed it twice
   * more into "already marked ready" / "already delivered". applyLocalStage
   * raised the row once; nothing stopped the next payload lowering it again.
   * The floor is applied to every payload for three minutes, or until the
   * server's own row has caught up — whichever comes first.

      var row = (rows || []).filter(function (r) { return r && r.orderId === id; })[0];
      if (!row) return;
      var caughtUp = (f.stage == null || row.stage >= f.stage) && (!f.billAt || !!row.billAt);

  /** After a write the server answered without publishing: ask it to push the board to everyone now. */
