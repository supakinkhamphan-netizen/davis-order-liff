        '<div class="statBox"><div class="k">ค้างอยู่ในรอบนี้</div><div class="v">' + sales.pendingCount + '</div></div>' +
        '<div class="statBox"><div class="k">ยกเลิก</div><div class="v">' + (sales.cancelledCount || 0) + '</div></div>' +
        // Two promises (30 นาที / 45 นาที) so two scores — a blended number
        // across different targets cannot be acted on.
        '<div class="statBox"><div class="k">ตรงเวลา โรงแรม <small>(≤' + ot.hotel.target + ')</small></div><div class="v">' +
          (ot.hotel.pct == null ? '—' : ot.hotel.pct + '%') + '</div></div>' +
        '<div class="statBox"><div class="k">ตรงเวลา ร้าน→ร้าน <small>(≤' + ot.sell.target + ')</small></div><div class="v">' +
          (ot.sell.pct == null ? '—' : ot.sell.pct + '%') + '</div></div>' +
        '</div>' +
        (sales.staleCount
          ? '<div style="margin-top:12px;padding:10px 12px;background:#fef2f2;color:#991b1b;border-radius:8px;font-size:13px;font-weight:700">' +
            '🧹 ค้างข้ามรอบ ' + sales.staleCount + ' ออเดอร์ — ต้องไปเคลียร์</div>'
          : '') +
        // Phase 8 §7/§8.1 — two zone breakdowns, and the labels have to say
        // which is which. bySellerZone groups by the shop that FILLED the
        // order (24BLVD vs Fairway), which is what the owner asked to see.
        // byZone groups by who PLACED it and reads "โรงแรม" nearly all the way
        // down, because that is what a hotel ordering from its own shops looks
        // like. Both answer real questions; either one labelled just "โซน" is
        // how one gets read as the other.
        (sales.bySellerZone && sales.bySellerZone.length
          ? '<div style="margin-top:16px"><div class="k" style="font-size:12px;color:var(--ink-2);font-weight:600">ขายโดยโซน</div>' +
            sales.bySellerZone.map(function (z) {
              return '<div class="zoneRow"><span>' + esc(z.zone) +
                ' <span style="color:var(--ink-2)">(' + z.count + ' ใบ · ค้าง ' + (z.open || 0) + ')</span></span><b>' + baht(z.amount) + '</b></div>';
            }).join('') +
            // A split with no total leaves the reader adding it up in their head
            // every single time.
            '<div class="zoneRow" style="border-top:1px solid var(--line);font-weight:700"><span>รวมทุกโซน <span style="color:var(--ink-2)">(' +
              sales.bySellerZone.reduce(function (a, z) { return a + z.count; }, 0) + ' ใบ · ค้าง ' +
              sales.bySellerZone.reduce(function (a, z) { return a + (z.open || 0); }, 0) + ')</span></span><b>' +
              baht(sales.bySellerZone.reduce(function (a, z) { return a + z.amount; }, 0)) + '</b></div>' +
            '</div>'
          : '') +
        (sales.byZone && sales.byZone.length
          ? '<div style="margin-top:16px"><div class="k" style="font-size:12px;color:var(--ink-2);font-weight:600">สั่งโดย</div>' +
            sales.byZone.map(function (z) {
              return '<div class="zoneRow"><span>' + esc(z.zone) + ' <span style="color:var(--ink-2)">(' + z.count + ')</span></span><b>' + baht(z.amount) + '</b></div>';
            }).join('') + '</div>'
          : '') +
        shopBreakdownHtml();
    }

    // Say which trading round these numbers cover. Shops run 10:00–02:00, so
    // "today" is not the calendar day and showing the range removes the
    // guesswork about whether last night's small hours are in or out.
    var roundNote = sales && sales.range
      ? '<div style="font-size:12px;color:var(--ink-2);margin-top:2px">รอบขาย ' + esc(sales.range.from) +
        (sales.range.from === sales.range.to ? '' : ' – ' + esc(sales.range.to)) + ' (10:00 – 02:00)</div>'
      : '';
    return '<div class="card" id="salesPanel"><div class="id">📊 ยอดขาย' +
      (sales && sales.isScoped ? ' · เฉพาะร้านของคุณ' : '') + '</div>' + roundNote + chips + stats + '</div>';
  }

  function renderSummary() {
    var list = document.getElementById('list');
    if (authState === 'none') { hideShopFilterBar(); list.innerHTML = noAuthHtml(); return; }
    var salesHtml = isSalesViewer() ? salesPanelHtml() : '';
    if (!summary) { hideShopFilterBar(); list.innerHTML = salesHtml + skeletonCards(); return; }
    renderShopFilterBar(distinctShops(summary.rows));
    var rows = shopFilter ? summary.rows.filter(function (r) { return r.seller === shopFilter; }) : summary.rows;
    if (rows.length === 0) {
      list.innerHTML = salesHtml + (shopFilter
        ? '<div class="empty">ยังไม่มีออเดอร์ที่ส่งมอบแล้วของ "' + esc(shopFilter) + '" ในเดือนนี้</div>'
        : '<div class="empty">ยังไม่มีออเดอร์ที่ส่งมอบแล้วในเดือนนี้</div>');
      return;
    }
    // The server's grandTotal is authoritative for the unfiltered view; once a
    // shop is picked the total has to be recomputed from just its rows.
    var total = shopFilter ? rows.reduce(function (sum, r) { return sum + Number(r.amount || 0); }, 0) : summary.grandTotal;
    list.innerHTML = salesHtml + '<div class="card"><div class="id">สรุปเดือน ' + esc(summary.monthKey) + (shopFilter ? ' · ' + esc(shopFilter) : '') + '</div>' +
      rows.map(function (r) {
        return '<div class="sumRow"><span>' + esc(r.seller) + ' → ' + esc(r.buyer) + ' <span style="color:var(--ink-2)">(' + r.count + ' ออเดอร์)</span></span>' +
          '<b>' + Number(r.amount).toLocaleString('en-US') + '</b></div>';
      }).join('') +
      '<div class="sumTotal"><span>' + (shopFilter ? 'รวมเฉพาะร้านนี้' : 'รวมทั้งหมด') + '</span><span>' + Number(total).toLocaleString('en-US') + ' บาท</span></div>' +
      // Payroll export names guests, rooms, and individual payments — same bar
      // as the SLA digest, so it's gated by role here too, not just server-side.
      (me && me.role === 'manager'
        ? '<button class="actionBtn" style="margin-top:14px;width:100%" id="btnExportPayroll" onclick="downloadPayrollCsv()">📥 ดาวน์โหลดไฟล์บัญชี (เดือนที่แล้ว)</button>'
        : '') +
      '</div>';
  }

  /** Accounting's monthly pay-cycle file: order detail + cross-store totals for the month that just closed. Manager role only (enforced server-side too). */
  /**
   * A client-side Blob + <a download> never reliably reaches an actual file
   * on the phone from inside LINE's in-app browser (iOS especially — the
   * webview has nowhere real to save it, so "the download" just vanishes).
   * The backend now saves the CSV to Drive instead and hands back a share
   * link; opening that in the SYSTEM browser (external:true, not LINE's own
   * webview) is what actually lets iOS/Android download or hand it to Sheets.
   */
  /** Opens the PDF — a finished document accounting can read/print immediately — the CSV lands in the same Drive folder either way, for whoever needs to import the numbers instead. */
  function openExportedCsv(r) {
    if (!r.ok && r.error) { toast(r.error, true); return; }
    var url = r.drivePdfUrl || r.driveUrl;
    if (!url) { toast('ได้ไฟล์แต่ไม่มีลิงก์เปิด — แจ้งผู้ดูแลระบบ', true); return; }
    liff.openWindow({ url: url, external: true });
  }

  function downloadPayrollCsv() {
    withButtonBusy('btnExportPayroll', 'กำลังสร้างไฟล์...', function () {
      return callApi('exportMonthlyPayrollCsvViaLiff', creds()).then(openExportedCsv);
    });
  }

  /** Zone-only companion to downloadPayrollCsv — just the 24BLVD/Fairway payment lines, for whatever month is picked in the ผู้บริหาร tab's month field (not always the previous month like the full export). */
  function downloadZonePaymentCsv() {
    withButtonBusy('btnExportZone', 'กำลังสร้างไฟล์...', function () {
      var payload = creds();
      payload.monthKey = managerMonthKey;
      return callApi('exportZonePaymentCsvViaLiff', payload).then(openExportedCsv);
    });
  }

  /**
   * ผู้บริหาร tab: two independent cards (SLA leaderboard, monthly
   * reconciliation) that each load and fail on their own — a slow/broken
   * reconciliation query must not blank out a working leaderboard, and vice
   * versa. Neither ever runs for a plain 'staff' caller: the tab that opens
   * this view is itself hidden until whoAmIViaLiff says otherwise, and the
   * backend re-checks role independently (requireManagerActor_).
   */
  function renderManager() {
    hideShopFilterBar();
    var list = document.getElementById('list');
    if (authState === 'none') { list.innerHTML = noAuthHtml(); return; }

    var html = appealsCardHtml();

    html += '<div class="card"><div class="id">🏆 อันดับค่าปรับ SLA</div>' +
      '<div class="mgrPeriodRow">' +
      [7, 30, 90].map(function (d) {
        return '<button class="shopChip' + (managerDays === d ? ' active' : '') + '" onclick="setManagerDays(' + d + ')">' + d + ' วัน</button>';
      }).join('') +
      '</div>';
    if (!managerLeaderboard) {
      html += '<div style="font-size:13px;color:var(--ink-2);margin-top:10px">กำลังโหลด...</div>';
    } else if (managerLeaderboard.error) {
      html += '<div class="empty" style="padding:16px 0">' + esc(managerLeaderboard.error) + '</div>';
    } else if (!managerLeaderboard.rows.length) {
      html += '<div class="empty" style="padding:16px 0">ไม่มีรายการโดนปรับใน ' + managerDays + ' วันที่ผ่านมา 🎉</div>';
    } else {
      if (managerLeaderboard.isScoped) html += '<div style="font-size:12px;color:var(--ink-2);margin-top:10px">แสดงเฉพาะร้านของคุณ</div>';
      html += managerLeaderboard.rows.map(function (r, i) {
        // Two figures on purpose: what is settled and collectable, and what is
        // still inside its appeal window. One blended number is what made the
        // appeal channel look decorative.
        var pending = r.pendingAmount
          ? ' <span style="color:var(--ink-2);font-weight:400">+' + Number(r.pendingAmount).toLocaleString('en-US') + ' รออุทธรณ์</span>'
          : '';
        return '<div class="sumRow"><span>' + (i + 1) + '. ' + esc(r.name || '(ไม่ทราบชื่อ)') +
          ' <span style="color:var(--ink-2)">(' + r.count + ' ครั้ง)</span></span><b>' +
          Number(r.amount).toLocaleString('en-US') + pending + '</b></div>';
      }).join('');
    }
    html += '</div>';

    html += '<div class="card"><div class="id">📅 สรุปรายเดือน</div>' +
      '<input type="month" class="mgrMonthInput" value="' + esc(managerMonthKey) + '" onchange="setManagerMonth(this.value)" />';
    if (!managerRecon) {
      html += '<div style="font-size:13px;color:var(--ink-2);margin-top:10px">กำลังโหลด...</div>';
    } else if (managerRecon.error) {
      html += '<div class="empty" style="padding:16px 0">' + esc(managerRecon.error) + '</div>';
    } else if (!managerRecon.rows.length) {
      html += '<div class="empty" style="padding:16px 0">ไม่มีออเดอร์ที่ส่งมอบแล้วในเดือนนี้</div>';
    } else {
      if (managerRecon.isScoped) html += '<div style="font-size:12px;color:var(--ink-2);margin-top:10px">แสดงเฉพาะร้านของคุณ</div>';
      html += managerRecon.rows.map(function (r) {
        return '<div class="sumRow"><span>' + esc(r.seller) + ' → ' + esc(r.buyer) +
          ' <span style="color:var(--ink-2)">(' + r.count + ' ออเดอร์)</span></span><b>' + Number(r.amount).toLocaleString('en-US') + '</b></div>';
      }).join('') +
        '<div class="sumTotal"><span>รวมทั้งหมด</span><span>' + Number(managerRecon.grandTotal).toLocaleString('en-US') + ' บาท</span></div>';
    }
    html += '</div>';

    // Zone rollup: AMORE/LULU/BESOBESO/NOT IN BANGKOK collapse into one
    // 24BLVD line, MANDRAKE CAFE into Fairway — the number actually paid,
    // not per-shop. null (not just empty) for a venue_manager, since their
    // scoped view is one shop, not a zone.
    if (managerRecon && managerRecon.zoneRows) {
      html += '<div class="card"><div class="id">💰 ยอดจ่ายจริงตามโซน</div>';
      if (!managerRecon.zoneRows.length) {
        html += '<div class="empty" style="padding:16px 0">ไม่มียอดข้ามโซนเดือนนี้</div>';
      } else {
        html += managerRecon.zoneRows.map(function (r) {
          return '<div class="sumRow"><span>' + esc(r.sellerZone) + ' → ' + esc(r.buyerZone) +
            ' <span style="color:var(--ink-2)">(' + r.count + ' ออเดอร์)</span></span><b>' + Number(r.amount).toLocaleString('en-US') + '</b></div>';
        }).join('');
      }
      html += '<button class="actionBtn" style="margin-top:14px;width:100%" id="btnExportZone" onclick="downloadZonePaymentCsv()">📥 ดาวน์โหลดไฟล์จ่ายเงินตามโซน</button>';
      html += '</div>';
    }

    list.innerHTML = html;
  }

  function isFullManager() { return !!me && me.role === 'manager'; }

  /**
   * Fines waiting on a decision. Filed appeals come first and carry the three
   * buttons; the rows nobody has answered yet are listed underneath as a
   * count, not as work — they close themselves at their due date.
   */
  function appealsCardHtml() {
    if (!isFullManager()) return '';
    var html = '<div class="card"><div class="id">🙋 อุทธรณ์ค่าปรับ</div>';
    if (!appeals) return html + '<div style="font-size:13px;color:var(--ink-2);margin-top:10px">กำลังโหลด...</div></div>';
    if (appeals.error) return html + '<div class="empty" style="padding:16px 0">' + esc(appeals.error) + '</div></div>';

    if (!appeals.filed.length) {
      html += '<div class="empty" style="padding:16px 0">ไม่มีเรื่องรออุทธรณ์ 🎉</div>';
    } else {
      html += appeals.filed.map(function (a) {
        var key = a.orderId + '|' + a.leg;
        var busy = appealBusy === key;
        var d = ' data-appeal="' + escAttr(key) + '"';
        return '<div class="appealRow">' +
          '<div class="appealTop"><span>' + esc(a.orderId) + ' · ' + esc(a.leg) + '</span><b>' + Number(a.amount || a.deduction).toLocaleString('en-US') + ' บาท</b></div>' +
          '<div class="appealMeta">ผู้ถูกหัก: ' + esc(a.charged || '-') + ' · ล่าช้า ' + a.delayMinutes + ' นาที (' + esc(a.band) + ')<br>ครบกำหนด ' + esc(a.dueDate) + '</div>' +
          '<div class="appealActions">' +
            '<button class="appealBtn warn"' + d + ' data-act="cancel"' + (busy ? ' disabled' : '') + '>ยกเลิกค่าปรับ</button>' +
            '<button class="appealBtn"' + d + ' data-act="reassign-open"' + (busy ? ' disabled' : '') + '>เปลี่ยนผู้ถูกหัก</button>' +
            '<button class="appealBtn"' + d + ' data-act="uphold"' + (busy ? ' disabled' : '') + '>ยืนยันตามเดิม</button>' +
          '</div>' +
          '<div class="reassignRow" id="reassign-' + escAttr(key) + '">' +
            '<input type="text" placeholder="ชื่อคนที่ถูกหักแทน" data-reassign-name="' + escAttr(key) + '" />' +
            '<button class="appealBtn"' + d + ' data-act="reassign"' + (busy ? ' disabled' : '') + '>บันทึก</button>' +
          '</div>' +
          '</div>';
      }).join('');
    }
    if (appeals.pending && appeals.pending.length) {
      html += '<div class="appealMeta" style="margin-top:12px">ยังอยู่ในช่วงอุทธรณ์อีก ' + appeals.pending.length +
        ' รายการ — ถ้าไม่มีใครยื่น ระบบจะปิดเองเมื่อครบกำหนด</div>';
    }
    return html + '</div>';
  }

  function loadAppeals() {
    if (!isFullManager()) return;
    callApi('slaAppealsViaLiff', creds()).then(function (r) {
      appeals = (r && r.error) ? r : (r || { error: 'โหลดไม่สำเร็จ' });
    }).catch(function () {
      appeals = { error: 'โหลดไม่สำเร็จ ลองใหม่อีกครั้ง' };
    }).then(function () {
      if (currentTab === 'manager') renderManager();
    });
  }

  document.getElementById('list').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-appeal]');
    if (!btn) return;
    var key = btn.getAttribute('data-appeal');
    var act = btn.getAttribute('data-act');
    if (act === 'reassign-open') {
      var row = document.getElementById('reassign-' + key);
      if (row) row.classList.toggle('open');
      return;
    }
    var parts = key.split('|');
    var payload = creds();
    payload.orderId = parts[0];
    payload.leg = parts[1];
    payload.decision = act;
    if (act === 'reassign') {
      var input = document.querySelector('[data-reassign-name="' + key.replace(/"/g, '') + '"]');
      var name = input ? input.value.trim() : '';
      if (!name) { toast('ใส่ชื่อคนที่จะถูกหักแทนก่อน', true); return; }
      payload.toName = name;
    }
    appealBusy = key;
    renderManager();
    callApi('decideSlaAppealViaLiff', payload).then(function (r) {
      if (!r || r.error) { toast((r && r.error) || 'บันทึกไม่สำเร็จ', true); return; }
      toast('บันทึกแล้ว');
      appeals = null;
      loadAppeals();
      managerLeaderboard = null;
      loadManagerLeaderboard();
    }).catch(function () {
      toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง', true);
    }).then(function () {
      appealBusy = '';
      if (currentTab === 'manager') renderManager();
    });
  });

  function loadManagerLeaderboard() {
    var payload = creds();
    payload.days = managerDays;
    callApi('slaLeaderboardViaLiff', payload).then(function (r) {
      managerLeaderboard = (r && r.error) ? r : (r || { error: 'โหลดไม่สำเร็จ' });
    }).catch(function () {
      managerLeaderboard = { error: 'โหลดไม่สำเร็จ ลองใหม่อีกครั้ง' };
    }).then(function () {
      if (currentTab === 'manager') renderManager();
    });
  }
  function loadManagerRecon() {
    var payload = creds();
    payload.monthKey = managerMonthKey;
    callApi('monthlyReconciliationViaLiff', payload).then(function (r) {
      managerRecon = (r && r.error) ? r : (r || { error: 'โหลดไม่สำเร็จ' });
    }).catch(function () {
      managerRecon = { error: 'โหลดไม่สำเร็จ ลองใหม่อีกครั้ง' };
    }).then(function () {
      if (currentTab === 'manager') renderManager();
    });
  }
  function setManagerDays(d) {
    managerDays = d;
    managerLeaderboard = null;
    render();
    loadManagerLeaderboard();
  }
  function setManagerMonth(monthKey) {
    if (!monthKey) return;
    managerMonthKey = monthKey;
    managerRecon = null;
    render();
    loadManagerRecon();
  }

  var GROUP_META = [
    null,
    { key: 1, title: '⚡ กดใบนี้ก่อน' },
    { key: 2, title: '🅿 ค้างนาน — กดได้เลย ไม่หักคุณ' },
    { key: 3, title: '🔵 กำลังทำอยู่' },
    { key: 4, title: '⚪ ยังไม่ถึงเกณฑ์', collapsed: true },
  ];
  var group4Open = false;
  function cardHtml(r) {
    var title = r.isSell ? (esc(r.buyer) + ' สั่งจาก ' + esc(r.seller)) : esc(r.subtitle);
    var sub = r.isSell ? ('สั่งข้ามร้าน — ' + esc(r.seller) + ' เป็นคนเตรียม') : esc(r.seller);
    if (r.orderedByName) sub += ' · สั่งโดย ' + esc(r.orderedByName);
    var c = clockFor(r);
    var promise = promiseClock(r);
    var menuOpen = !!openMenus[r.orderId];
    return '<div class="card" style="position:relative" id="card-' + r.orderId + '">' +
      '<div class="clock ' + c.tier + '" id="clk-' + r.orderId + '">' + esc(c.text) + '</div>' +
      '<div class="title">' + title + '</div>' +
      '<div class="sub">' + sub + '</div>' +
      // The guest's wait, under the fine clock: the fine clock says whether
      // the person pressing is exposed, this says whether the promise is
      // still intact. They are not the same question and the runner needs both.
      (promise ? '<div class="promise ' + promise.tier + '" id="pro-' + r.orderId + '">' + esc(promise.text) + '</div>' : '') +
      (r.isCancelled ? '<div class="promise late">🚫 ยกเลิกแล้ว</div>' : '') +
      '<div class="items">' + esc(r.items) + '</div>' +
      actionSectionHtml(r) +
      '<button class="moreBtn" onclick="toggleMenu(\'' + r.orderId + '\')" aria-label="ตัวเลือกเพิ่มเติม">⋯</button>' +
      '<div class="moreMenu' + (menuOpen ? ' open' : '') + '" id="menu-' + r.orderId + '">' +
        '<div style="font-size:12px;color:var(--ink-2);padding:0 4px 4px">' + esc(r.orderId) + '</div>' +
        // 🔔 fires a real, billed LINE push and wakes a manager at 01:00. It used
        // to sit full-width 8px under the main button — one slip with a wet
        // thumb. Behind ⋯ it always takes two deliberate taps.
        (r.stage < 3 ? '<button id="nudge-' + r.orderId + '" onclick="doNudge(\'' + r.orderId + '\')">🔔 เตือนผู้จัดการร้าน</button>' : '') +
        // One line per photo, each saying what it shows. There are three kinds
        // now and two of them are the same plate — "ดูรูป (3)" would be
        // useless for the one job they exist for, telling whether a problem
        // started in the kitchen or on the way. (Phase 5 §2.4)
        ((r.photos && r.photos.length)
          ? r.photos.map(function (p) {
              return '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.label) + '</a>';
            }).join('')
          : '<div style="padding:12px 4px;color:var(--ink-2);font-size:15px">📷 ยังไม่มีรูป</div>') +
        '<button onclick="showRules()">📋 กติกาค่าปรับ</button>' +
        // Destructive, so it sits at the bottom of a menu that already takes
        // two deliberate taps to open, and asks for a reason before it does
        // anything (the backend refuses a cancellation without one).
        (r.stage < 3 && !r.isCancelled
          ? '<button style="color:#b91c1c;font-weight:700" onclick="askCancel(\'' + r.orderId + '\')">🚫 ยกเลิกออเดอร์</button>'
          : '') +
      '</div>' +
      '</div>';
  }

  function miniRowHtml(r) {
    var c = clockFor(r);
    return '<div class="card" style="position:relative" id="card-' + r.orderId + '">' +
      '<div class="clock ' + c.tier + '" id="clk-' + r.orderId + '">' + esc(c.text) + '</div>' +
      '<div class="rowMini"><div class="body">' +
      '<div class="title" style="font-size:16px">' + esc(r.subtitle) + '</div>' +
      '<div class="sub">' + esc(r.seller) + '</div>' +
      '<div class="items" style="margin-top:4px">' + esc(r.items.replace(/\n/g, ', ')) + '</div>' +
      '</div>' + actionSectionHtml(r, true) + '</div>' +
      // stage 1 needs a bill + amount before it can advance; stage 2 is a bare press.
      (r.stage === 1 ? formBodyHtml(r.orderId, r.is24 ? 'submitFood' : 'submitDeliverForm') : '') +
      '</div>';
  }

  function render() {
    var list = document.getElementById('list');
    if (authState === 'none') { hideShopFilterBar(); list.innerHTML = noAuthHtml(); return; }
    if (currentTab === 'summary') { renderSummary(); return; }
    if (currentTab === 'manager') { renderManager(); return; }
    if (allRows === null) { hideShopFilterBar(); list.innerHTML = skeletonCards(); return; }
    var tabRows = allRows.filter(function (r) {
      if (currentTab === 'all') return true;
      // While whoAmI is still in flight `me` is null. The old test dropped
      // every claimed row in that window, so for the first few seconds of every
      // shift a runner holding two bags saw an empty "ต้องทำ" — which teaches
      // people not to trust the screen. Unknown identity now shows more, not less.
      if (r.stage >= 3) return false;
      if (!r.assignedUserId) return true;
      return !me || r.assignedUserId === me.userId;
    });

    // Chip list reflects THIS tab's shops (pre-filter), so switching back to
    // "ทุกร้าน" is always one tap away even after picking one.
    renderShopFilterBar(distinctShops(tabRows));
    var rows = shopFilter ? tabRows.filter(function (r) { return r.seller === shopFilter; }) : tabRows;

    if (rows.length === 0) {
      list.innerHTML = shopFilter
        ? '<div class="empty"><div style="font-size:40px">🌙</div>' +
          '<div style="font-size:17px;font-weight:700;margin-top:16px;color:var(--ink)">ไม่มีออเดอร์ค้างของ "' + esc(shopFilter) + '" ตอนนี้</div></div>'
        : '<div class="empty"><div style="font-size:40px">🌙</div>' +
          '<div style="font-size:17px;font-weight:700;margin-top:16px;color:var(--ink)">ไม่มีออเดอร์ค้างตอนนี้</div>' +
          // The real ambiguity is "no work" versus "the app is broken" — say which.
          '<div style="font-size:15px;margin-top:10px;line-height:1.6">หน้าจอจะขึ้นเองเมื่อมีออเดอร์ใหม่<br>ไม่ต้องคอยกดรีเฟรช</div></div>';
      return;
    }

    var buckets = { 1: [], 2: [], 3: [], 4: [] };
    rows.forEach(function (r) { buckets[groupOf(r)].push(r); });
    Object.keys(buckets).forEach(function (k) {
      buckets[k].sort(function (a, b) { return clockFor(b).sec - clockFor(a).sec; }); // longest waiting first
    });

    var html = '';
    [1, 2, 3, 4].forEach(function (g) {
      var items = buckets[g];
      if (!items.length) return;
      var meta = GROUP_META[g];
      var collapsed = g === 4 && !group4Open;
      html += '<div class="groupHead"><span>' + meta.title + ' (' + items.length + ')</span>' +
        (g === 4 ? '<button onclick="group4Open=!group4Open;render()" style="border:none;background:none;color:inherit;font-size:15px;font-family:inherit">' + (collapsed ? 'ดู ⌄' : 'ซ่อน ⌃') + '</button>' : '') +
        '</div>';
      if (collapsed) return;
      html += items.map(g === 3 ? miniRowHtml : cardHtml).join('');
    });
    list.innerHTML = html;
    layoutGroups = snapshotGroups(rows);
    pendingReorder = false;
    updateReorderBar();
  }

  /** Fingerprint of which group each row was in when the board was last laid out. */
  function snapshotGroups(rows) {
    var m = {};
    (rows || []).forEach(function (r) { m[r.orderId] = groupOf(r); });
    return m;
  }
  var layoutGroups = {};

  /**
   * Clocks advance every second, so rows would keep changing group under the
   * runner's thumb — and a list that reorders itself as someone reaches for a
   * button is how you press the wrong order and pay for it. The layout is held
   * still and a bar offers the reorder instead.
   */
  function updateReorderBar() {
    var bar = document.getElementById('learnBar');
    if (!pendingReorder) { if (bar.dataset.mode === 'reorder') { bar.style.display = 'none'; bar.dataset.mode = ''; } return; }
    bar.dataset.mode = 'reorder';
    document.getElementById('learnText').textContent = '↑ มีใบที่ควรกดก่อน — แตะเพื่อจัดใหม่';
    bar.style.display = 'flex';
    bar.onclick = function () { pendingReorder = false; render(); };
  }
  function hideLearnBar() {
    var bar = document.getElementById('learnBar');
    bar.style.display = 'none';
    if (bar.dataset.mode !== 'reorder') { try { localStorage.setItem('learnHidden', '1'); } catch (e) {} }
  }

  var CANCEL_REASONS = ['แขกยกเลิก', 'สั่งผิด', 'ของหมด', 'อื่นๆ'];

  /**
   * Two steps on purpose. A one-tap cancel on a board that repaints every ten
   * seconds is a mis-tap waiting to happen, and the reason is not optional —
   * an order that vanished with no reason recorded is unanswerable a week later.
   *
   * Rendered in the page rather than with prompt(): a native dialog inside
   * LINE's in-app webview is unreliable (silently suppressed on some iOS
   * builds), and a cancel button that appears to do nothing is worse than no
   * cancel button at all. It also gives the reasons real thumb-sized targets.
   */
  function askCancel(orderId) {
    closeCancelSheet();
    var sheet = document.createElement('div');
    sheet.id = 'cancelSheet';
    sheet.className = 'sheetWrap';
    sheet.innerHTML =
      '<div class="sheet">' +
      '<div class="sheetTitle">ยกเลิกออเดอร์ ' + esc(orderId) + '</div>' +
      '<div class="sheetHint">เลือกเหตุผล — บันทึกลงประวัติออเดอร์</div>' +
      CANCEL_REASONS.map(function (reason) {
        return '<button class="sheetBtn" data-reason="' + escAttr(reason) + '">' + esc(reason) + '</button>';
      }).join('') +
      '<button class="sheetBtn cancel" data-close="1">ไม่ยกเลิก กลับไปก่อน</button>' +
      '</div>';
    sheet.addEventListener('click', function (e) {
      if (e.target === sheet || e.target.getAttribute('data-close')) { closeCancelSheet(); return; }
      var btn = e.target.closest('button[data-reason]');
      if (!btn) return;
      var reason = btn.getAttribute('data-reason');
      sheet.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      btn.textContent = 'กำลังยกเลิก...';
      var payload = creds();
      payload.orderId = orderId;
      payload.reason = reason;
      callApi('cancelOrderViaLiff', payload).then(function (r) {
        closeCancelSheet();
        if (!r || !r.ok) { toast((r && (r.reason || r.error)) || 'ยกเลิกไม่สำเร็จ', true); return; }
        toast('ยกเลิก ' + orderId + ' แล้ว (' + reason + ')');
        openMenus = {};
        forceRefresh();
      }).catch(function () { closeCancelSheet(); toast('ยกเลิกไม่สำเร็จ', true); });
    });
    document.body.appendChild(sheet);
  }
  function closeCancelSheet() {
    var el = document.getElementById('cancelSheet');
    if (el) el.remove();
  }

  function toggleMenu(orderId) {
    var wasOpen = !!openMenus[orderId];
    openMenus = {};
    openMenus[orderId] = !wasOpen;
    render();
  }

  function showRules() {
    // Straight from SLA_BANDS_* in order-sla.js. The 15-minute rescue rule in
    // particular was invisible to the people it protects.
    toast('เกณฑ์: รับออเดอร์ช้า 5 นาที = 100฿ · 10 นาที = 200฿ · เกิน 15 นาที = ไม่หักคุณ (นับเป็นออเดอร์ค้างของร้าน)');
  }

  /** Ticks only the clock text, never the layout — re-rendering the list every
   *  second would wipe any open form and burn battery for nothing. */
  function tickClocks() {
    if (!allRows || currentTab === 'summary') return;
    var moved = false;
    allRows.forEach(function (r) {
      var el = document.getElementById('clk-' + r.orderId);
      if (!el) return;
      var c = clockFor(r);
      if (el.textContent !== c.text) el.textContent = c.text;
      if (el.className !== 'clock ' + c.tier) el.className = 'clock ' + c.tier;
      // Text only, same as the fine clock above: touching layout every second
      // is what makes a board feel like it is fighting the thumb.
      var pel = document.getElementById('pro-' + r.orderId);
      var pc = promiseClock(r);
      if (pel && pc) {
        if (pel.textContent !== pc.text) pel.textContent = pc.text;
        if (pel.className !== 'promise ' + pc.tier) pel.className = 'promise ' + pc.tier;
      }
      if (layoutGroups[r.orderId] !== undefined && layoutGroups[r.orderId] !== groupOf(r)) moved = true;
    });
    if (moved && !pendingReorder) { pendingReorder = true; updateReorderBar(); }
  }

  /** Skips a tick rather than queuing — a slow poll response and the next
   * timer firing at the same time is what made the page feel sluggish
   * (requests piling up in flight, each one racing to repaint last). */
  function refresh() {
    if (refreshing) return;
    // Never repaint over an open form. render() rebuilds list.innerHTML
    // wholesale, so an open form loses the amount being typed AND the chosen
    // <input type="file">: on a busy night someone else's button press
    // repaints the board every few seconds, and the runner mid-entry is told
    // "แนบรูปบิลก่อน" for a bill they just attached. Polling resumes as soon
    // as the form closes.
    if (Object.keys(openForms).length) return;
    if (!idToken) return; // not identified yet — the board now requires it
    refreshing = true;
    var myGeneration = boardGeneration;
    var pending = firstBoard || callApi('listOrderStatusRows', { idToken: idToken, accessToken: accessToken, requestGroupId: REQUEST_GROUP });
    firstBoard = null;
    pending.then(function (rows) {
      if (myGeneration !== boardGeneration) return; // a write landed mid-flight; this data predates it
      if (!rows || rows.error) { showOffline(rows && rows.error); return; }
      noteServerNow(rows);
      allRows = rows;
      // Re-rendering identical data throws away every open form's typed
      // amount and re-decodes the same HTML — repaint only on a real change.
      clearOffline();
      var payload = JSON.stringify(rows);
      if (payload !== lastPayload) { lastPayload = payload; render(); }
      // Same tick, no extra timer: the boss asked for the sales figures to be
      // live, and the board is already polling. Only fetched while the tab
      // that shows them is actually open.
      if (currentTab === 'summary' && isSalesViewer()) loadSales(false);
      document.getElementById('lastUpdated').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH');
    }).catch(function () {
      showOffline();
    }).finally(function () { refreshing = false; });
  }

  /** Anchors the local clock to the server's, so countdowns survive a bad phone clock and a dead connection. */
  function noteServerNow(rows) {
    var stamp = rows && rows.length && rows[0].serverNow;
    if (!stamp) return;
    var t = Date.parse(String(stamp).replace(' ', 'T'));
    if (isNaN(t)) return;
    serverNowMs = t;
    serverNowLocal = performance.now();
  }

  /**
   * "The app is dead" has to be impossible to miss. It used to be written into
   * an 11px muted line UNDER the whole list — on a busy night that is four
   * screens down, so nobody ever saw it and runners stood watching a frozen
   * board believing there was simply no new work.
   *
   * The stale data stays on screen: they still need it to go and fetch things.
   * They just have to know it is stale — and the clocks keep counting, because
   * the fines do not pause when the wifi does.
   */
  function showOffline(message) {
    failedFetches++;
    // A message from the server is a definite answer, not a flaky connection —
    // show it at once. Sitting silently on skeleton cards (which is what the
    // page did) tells the runner nothing at all.
    if (!message && failedFetches < 2 && navigator.onLine !== false) return;
    if (allRows === null) {
      document.getElementById('list').innerHTML =
        '<div class="empty">โหลดรายการไม่สำเร็จ<br><span style="font-size:14px">' + esc(message || 'เชื่อมต่อไม่ได้') + '</span></div>';
    }
    var bar = document.getElementById('offlineBar');
    var since = serverNowMs ? Math.floor((performance.now() - serverNowLocal) / 60000) : 0;
    document.getElementById('offlineText').textContent = message ||
      ('⚠ ไม่ได้เชื่อมต่อ · ข้อมูลเมื่อ ' + (since < 1 ? 'ไม่ถึง 1' : since) + ' นาทีที่แล้ว — ตัวเลขบนจออาจไม่ตรง');
    bar.style.display = 'flex';
  }
  function clearOffline() {
    failedFetches = 0;
    document.getElementById('offlineBar').style.display = 'none';
  }

  /**
   * A write just landed. Two things have to happen, in this order:
   *
   * 1. Move the card forward LOCALLY and repaint right now. The server already
   *    accepted the change, so the new stage is a fact — making the runner
   *    stare at the old status until a round trip completes is what made the
   *    app feel broken ("บันทึกแล้วแต่สถานะไม่เปลี่ยน ต้องเข้าออกใหม่").
   * 2. Then confirm against the server with `fresh: true`, bypassing the
   *    8-second shared cache, so the optimistic guess is replaced by truth.
   */
  function applyLocalStage(orderId, stage) {
    boardGeneration++; // every poll already in flight is now stale
    if (!allRows) return;
    allRows.forEach(function (r) {
      if (r.orderId === orderId && stage > r.stage) r.stage = stage;
    });
    lastPayload = ''; // the next server payload must repaint over this guess
    render();
  }

  function forceRefresh() {
    lastPayload = '';
    boardGeneration++;
    refreshing = true; // deliberately overrides an in-flight poll: this request is the authoritative one
    var myGeneration = boardGeneration;
    return callApi('listOrderStatusRows', { idToken: idToken, accessToken: accessToken, requestGroupId: REQUEST_GROUP, fresh: true }).then(function (rows) {
      if (myGeneration !== boardGeneration) return;
      if (!rows || rows.error) return;
      noteServerNow(rows);
      clearOffline();
      allRows = rows;
      lastPayload = JSON.stringify(rows);
      render();
      document.getElementById('lastUpdated').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH');
    }).catch(function () {
      // The optimistic repaint above still stands — say nothing, the next poll retries.
    }).finally(function () { refreshing = false; });
  }

  // Polling only runs while the page is actually on screen. The old version
  // kept a 10s timer alive in the background: every minute a backgrounded
  // webview burned six pointless round trips, and coming back to the app meant
  // waiting behind that queue.
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      // The sales panel used to die here. `refresh()` is the only caller of
      // loadSales, and this early return meant that the moment the สรุป tab
      // was opened the numbers froze at whatever they were on arrival — the
      // exact opposite of the "ดูยอด real time" this was built for. The
      // summary tab now polls the figures directly instead of the board it
      // is not showing.
      if (currentTab === 'summary') { loadSales(false); return; }
      refresh();
    }, 10000);
  }
  /** Teaches the one thing that actually costs money, and only for the first couple of shifts. */
  function showLearnBarIfNew() {
    var hidden = false;
    try { hidden = localStorage.getItem('learnHidden') === '1'; } catch (e) {}
    if (hidden) return;
    var bar = document.getElementById('learnBar');
    document.getElementById('learnText').innerHTML =
      '💡 "รับออเดอร์" = บอกระบบว่าคุณจะไปเอาให้ · กดแล้วนาฬิกาแคชเชียร์หยุดทันที';
    bar.style.display = 'flex';
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function withButtonBusy(orderId, label, fn) {
    var btn = document.getElementById(orderId);
    if (btn) {
      btn.disabled = true;
      btn.dataset.orig = btn.textContent;
      btn.textContent = label;
      btn.classList.add('busy');
    }
    if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} }
    return fn().finally(function () {
      if (btn) {
        btn.disabled = false;
        btn.textContent = btn.dataset.orig || btn.textContent;
        btn.classList.remove('busy');
      }
    });
  }

  /** Marks a card as "shown, not yet confirmed" with a left edge — a shape, not a colour. */
  function markPending(orderId, state) {
    var card = document.getElementById('card-' + orderId);
    if (!card) return;
    card.classList.remove('pending', 'failed');
    if (state) card.classList.add(state);
  }

  function doClaim(orderId) {
    withButtonBusy('btn-' + orderId, 'กำลังรับ...', function () {
      return callApi('claimOrderViaLiff', { idToken: idToken, accessToken: accessToken, orderId: orderId }).then(function (r) {
        if (!r.ok) { toast(r.reason || r.error || 'บันทึกไม่สำเร็จ ใบนี้ยังไม่มีใครรับ ลองกดอีกครั้ง', true); return; }
        toast('รับออเดอร์ ' + orderId + ' แล้ว');
        applyLocalStage(orderId, 1); // รอร้านรับ -> เตรียมอาหาร, on screen immediately
        markPending(orderId, 'pending');   // shown, not yet confirmed by the server
        forceRefresh().then(function () { markPending(orderId, ''); },
                            function () { markPending(orderId, 'failed'); });
      });
    });
  }

  function doNudge(orderId) {
    withButtonBusy('nudge-' + orderId, 'กำลังเตือน...', function () {
      return callApi('nudgeOrderViaLiff', { idToken: idToken, accessToken: accessToken, orderId: orderId }).then(function (r) {
        if (!r.ok) { toast(r.error || 'เตือนไม่สำเร็จ', true); return; }
        toast('เตือนผู้จัดการร้านแล้ว');
      });
    });
  }

  function loadSummary() {
    callApi('monthToDateSummaryViaLiff', creds()).then(function (s) {
      summary = s;
      if (currentTab === 'summary') renderSummary();
    }).catch(function () { toast('โหลดสรุปไม่สำเร็จ', true); });
  }

  /**
   * Sales figures for the picked range. Repaints only when the numbers
   * actually changed: renderSummary() rebuilds the whole list, so an
   * unconditional repaint on every 10-second tick would blur the date input
   * a manager is halfway through filling in.
   */
  var lastSalesPayload = '';
  function loadSales(force) {
    if (!isSalesViewer()) return;
    if (salesLoading) return;
    salesLoading = true;
    var payload = creds();
    payload.range = salesRange;
    if (salesRange === 'custom') { payload.from = salesFrom; payload.to = salesTo; }
    callApi('orderSalesSummaryViaLiff', payload).then(function (s) {
      if (!s || s.error) { if (force) toast(s && s.error ? s.error : 'โหลดยอดขายไม่สำเร็จ', true); return; }
      sales = s;
      var json = JSON.stringify(s);
      if (force || json !== lastSalesPayload) {
        lastSalesPayload = json;
        if (currentTab === 'summary') renderSummary();
      }
    }).catch(function () {
      if (force) toast('โหลดยอดขายไม่สำเร็จ', true);
    }).finally(function () { salesLoading = false; });
  }

  function setSalesRange(key) {
    salesRange = key;
    if (key === 'custom' && !salesFrom) {
      // Seed the pickers with today so the two fields are never both empty —
      // an empty date range submits as "today" server-side anyway, and showing
      // that up front is less confusing than two blank boxes.
      var t = new Date();
      var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
      salesTo = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
      salesFrom = salesTo;
    }
    sales = null;
    lastSalesPayload = '';
    renderSummary();
    if (key !== 'custom' || (salesFrom && salesTo)) loadSales(true);
  }

  document.getElementById('list').addEventListener('click', function (e) {
    var shopRow = e.target.closest('[data-shop-row]');
    if (shopRow) {
      shopFilter = shopRow.getAttribute('data-shop-row') || '';
      if (currentTab === 'summary') renderSummary(); else render();
      return;
    }
    var chip = e.target.closest('.rangeChip');
    if (!chip) return;
    setSalesRange(chip.getAttribute('data-range'));
  });
  document.getElementById('list').addEventListener('change', function (e) {
    if (e.target.id !== 'salesFrom' && e.target.id !== 'salesTo') return;
    salesFrom = document.getElementById('salesFrom').value;
    salesTo = document.getElementById('salesTo').value;
    if (salesFrom && salesTo) loadSales(true);
  });

  // doComplete() lived here: a one-tap close for 24BLVD that wrote no bill and
  // no amount, because both used to be captured at the kitchen step. They are
  // captured at handover now, so every close goes through the form and the
  // backend refuses a 24BLVD order that arrives without a bill. Removed rather
  // than left unused — a spare one-tap close is exactly the thing that gets
  // wired back to a button later.

  function submitWithPhoto(orderId, fn, nextStage, kind) {
    var isKitchen = kind === 'kitchen';
    var amountEl = document.getElementById('amt-' + orderId);
    var paymentEl = document.getElementById('pay-' + orderId);
    var foodEl = document.getElementById('food-' + orderId);
    var amount = amountEl ? amountEl.value : '';
    var payment = paymentEl ? paymentEl.value : '';
    var fileInput = document.getElementById('photo-' + orderId);
    var files = Array.prototype.slice.call(fileInput.files || []).slice(0, 3);
    var foodFiles = foodEl ? Array.prototype.slice.call(foodEl.files || []).slice(0, 1) : [];
    var errEl = document.getElementById('err-' + orderId);
    var submitBtn = document.getElementById('submit-' + orderId);
    errEl.textContent = '';
    if (!isKitchen && !amount) { errEl.textContent = '⚠ ใส่ยอดเงินที่จ่ายจริงตามบิล'; return; }
    // One message per missing photo, naming it — the runner has to know which
    // one to go and take.
    if (!isKitchen && !foodFiles.length) { errEl.textContent = '⚠ ยังไม่ได้ถ่ายรูปอาหารตอนวางส่ง'; return; }
    if (!files.length) {
      errEl.textContent = isKitchen
        ? '⚠ ถ่ายรูปอาหาร 1 รูปก่อนกดยืนยัน'
        : '⚠ ยังไม่ได้ถ่ายรูปบิล — ไม่มีบิลจะเคลียร์ยอดสิ้นเดือนไม่ได้';
      return;
    }
    submitBtn.disabled = true;
    errEl.textContent = 'กำลังเตรียมรูป...';
    shrinkAll(files.concat(foodFiles), function (allUrls) {
      // shrinkAll keeps the order it was given: bills first, then the single
      // handover photo appended above.
      var dataUrls = allUrls.slice(0, files.length);
      var foodUrls = allUrls.slice(files.length);
      // shrinkPhoto falls back to the ORIGINAL file when canvas fails (out of
      // memory on an older phone with a 12MP photo). A 4MB original becomes
      // ~5.5MB of base64 over hotel wifi and simply times out, and the runner
      // only ever saw "ส่งไม่สำเร็จ" with no idea why. Refuse it with a
      // reason they can act on instead.
      var tooBig = dataUrls.filter(function (u) { return u && u.length > 3000000; });
      if (tooBig.length) {
        submitBtn.disabled = false;
        errEl.textContent = '⚠ รูปใหญ่เกินไป ถ่ายใหม่ให้เห็นเฉพาะใบบิล ไม่ต้องติดโต๊ะ';
        return;
      }
      // 90 seconds of a static 'กำลังส่ง...' is why bills go missing: at about
      // 15 seconds of nothing moving, people close the app, the upload aborts,
      // and the whole thing starts over. A number that ticks is the proof it
      // is still alive.
      var startedAt = Date.now();
      errEl.style.color = 'var(--ink-2)';
      var uploadTimer = setInterval(function () {
        var sec = Math.floor((Date.now() - startedAt) / 1000);
        errEl.innerHTML = 'กำลังส่งบิล… ' + sec + ' วิ<br>' +
          '<span style="color:var(--warn-ink);font-weight:600">ไวไฟโรงแรมช้า อาจใช้เวลาถึง 1 นาที · ปิดหน้านี้แล้วรูปจะหาย</span>';
      }, 1000);
      errEl.textContent = 'กำลังส่งบิล… 0 วิ';
      var payload = {
        idToken: idToken, accessToken: accessToken, liffSource: 'order', ticketId: orderId,
      };
      if (isKitchen) {
        payload.photoDataUrls = dataUrls.filter(Boolean);
      } else {
        payload.amount = amount;
        payload.payment = payment;
        payload.billPhotoDataUrls = dataUrls.filter(Boolean);
        payload.foodPhotoDataUrls = foodUrls.filter(Boolean);
      }
      callApi(fn, payload).then(function (r) {
        clearInterval(uploadTimer);
        errEl.style.color = '';
        submitBtn.disabled = false;
        if (!r.ok) { errEl.textContent = r.error || 'ผิดพลาด'; return; }
        toast('บันทึก ' + orderId + ' เรียบร้อย');
        openForms = {};
        applyLocalStage(orderId, nextStage);
        forceRefresh();
      }).catch(function () {
        clearInterval(uploadTimer);
        errEl.style.color = '';
        submitBtn.disabled = false;
        errEl.textContent = '⚠ ส่งบิลไม่สำเร็จ รูปยังอยู่ในเครื่อง กดบันทึกอีกครั้งได้เลย ไม่ต้องถ่ายใหม่';
      });
    });
  }
  // รับอาหาร leaves the order at "กำลังจัดส่ง" (2) — one more press to go.
  // ส่งแล้ว (non-24BLVD) is terminal, so it lands on "ส่งมอบแล้ว" (3).
  /** Shrinks each picked file in turn and hands back the finished data URLs. */
  function shrinkAll(files, done) {
    var out = [];
    (function next(i) {
      if (i >= files.length) return done(out);
      shrinkPhoto(files[i], function (dataUrl) { out.push(dataUrl); next(i + 1); });
    })(0);
  }

  function submitFood(orderId) { submitWithPhoto(orderId, 'submitOrderFoodForm', 2, 'kitchen'); }
  function submitDeliverForm(orderId) { submitWithPhoto(orderId, 'submitOrderFulfillForm', 3, 'handover'); }

  function selectTab(tab) {
    currentTab = tab;
    ['Mine', 'All', 'Summary', 'Manager'].forEach(function (name) {
      document.getElementById('tab' + name).classList.toggle('active', tab === name.toLowerCase());
    });
    // The summary is a separate, heavier query — fetched the first time the
    // tab is opened rather than on every 10-second poll of the order list.
    if (tab === 'summary' && !summary) loadSummary();
    if (tab === 'summary' && !sales) loadSales(true);
    render();
  }
  document.getElementById('tabMine').addEventListener('click', function () { selectTab('mine'); });
  document.getElementById('tabAll').addEventListener('click', function () { selectTab('all'); });
  document.getElementById('tabSummary').addEventListener('click', function () {
    // Both caches cleared, not just `summary`: leaving `sales` populated meant
    // "!sales" in selectTab was false and switching away and back never
    // refetched, so the figures could be arbitrarily old with nothing on
    // screen saying so.
    summary = null;
    sales = null;
    lastSalesPayload = '';
    selectTab('summary');
  });
  document.getElementById('tabManager').addEventListener('click', function () {
    if (!managerMonthKey) managerMonthKey = thisMonthKey_();
    managerLeaderboard = null;
    managerRecon = null;
    appeals = null;
    selectTab('manager');
    loadManagerLeaderboard();
    loadManagerRecon();
    loadAppeals();
  });

  // Pausing the poll while the tab/webview is hidden (backgrounded) saves
  // requests and means the page doesn't come back to a burst of stale-timer
  // catch-up traffic — check once immediately on return instead.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') forceRefresh();
  });

  // The shell (with skeleton cards) goes up immediately, but the data now
  // waits for liff.init() — the board is private, see the security note in
  // order-liff-api.js.
  showApp();

  function showApp() {
    document.getElementById('buildTag').textContent = BUILD;
    document.getElementById('boot').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    if (REQUEST_GROUP) {
      // Scoped to one request: "ต้องทำ" would hide the shops already handled,
      // which is the opposite of what someone following their own order wants.
      currentTab = 'all';
      document.getElementById('tabMine').classList.remove('active');
      document.getElementById('tabAll').classList.add('active');
      var banner = document.getElementById('scopeBanner');
      banner.innerHTML = '<span>📦 กำลังดูเฉพาะคำขอ ' + esc(REQUEST_GROUP) + '</span>' +
        '<a href="' + esc(location.pathname) + '">ดูทั้งหมด</a>';
      banner.style.display = 'flex';
    }
    render();
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    idToken = liff.getIDToken() || '';
    try { accessToken = liff.getAccessToken() || ''; } catch (e) { accessToken = ''; }
    if (!idToken && !accessToken) {
      // No credential, no board: the payload carries guest room numbers. There
      // is no "view only" mode any more — buttons that can only ever fail just
      // teach staff the system is broken.
      authState = 'none';
      document.getElementById('whoLine').textContent = 'ยังไม่ได้ยืนยันตัวตน';
      render();
      return;
    }
    authState = 'ok';
    refresh();
    startPolling();
    // Clock text only; the layout is left alone (see tickClocks).
    if (!clockTimer) clockTimer = setInterval(tickClocks, 1000);
    showLearnBarIfNew();
    // Profile photo is a nicety — never let a failed fetch cost us the page.
    liff.getProfile().then(function (p) {
      if (p && p.pictureUrl) {
        var img = document.getElementById('avatar');
        img.src = p.pictureUrl;
        img.style.display = 'block';
      }
    }).catch(function () {});
    callApi('whoAmIViaLiff', { idToken: idToken, accessToken: accessToken }).then(function (whoami) {
      if (!whoami || !whoami.userId) { document.getElementById('whoLine').textContent = 'ยืนยันตัวตนไม่สำเร็จ'; return; }
      me = whoami;
      document.getElementById('whoLine').textContent = me.actorName + ' (' + me.role + ')';
      // The backend re-checks this on every manager call regardless — this
      // only decides whether the tab is worth showing at all.
      if (me.role === 'manager' || me.role === 'venue_manager') {
        document.getElementById('tabManager').style.display = '';
      }
      // The brief card's "ดูรายละเอียด" deep link. Applied here rather than at
      // boot because the sales panel is manager-only — the role is not known
      // until whoAmI comes back, and jumping a 'staff' user to a tab whose
      // main content they cannot load would just show them an error.
      if (INITIAL_TAB === 'summary' && isSalesViewer()) {
        if (INITIAL_RANGE) salesRange = INITIAL_RANGE;
        selectTab('summary');
        return;
      }
      render(); // re-filter "ต้องทำ" now that me.userId is known
    });
  }).catch(function (err) {
    // The board is already on screen — a LIFF failure costs identity (and so
    // the action buttons), not the whole page.
    authState = 'none';
    document.getElementById('whoLine').textContent = 'เชื่อมต่อไลน์ไม่สำเร็จ';
    render();
    console.error(err);
  });
</script>
</body>
</html>
